<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAN Security — พิมพ์รายงานพบผู้ว่าจ้าง OP05</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../Backend/config.js"></script>
  <style>
    :root {
      --navy: #1B2A4A;
      --navy-mid: #243560;
      --gold: #C9920C;
      --gold-light: #F0B429;
      --blue: #1A56DB;
      --gray-100: #F4F6F9;
      --gray-200: #E8ECF2;
      --gray-400: #9AABC2;
      --gray-600: #5A6E8C;
      --white: #FFFFFF;
      --green: #0D7A4E;
      --green-bg: #E6F4EE;
      --red: #C0392B;
      --red-bg: #FDECEA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--gray-100);
      color: var(--navy);
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* ===== PRINT STYLES ===== */
    @page {
      size: A4;
      margin: 8mm;
    }

    @media print {
      body {
        background: white;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .page {
        box-shadow: none;
        border: none;
        max-width: 100%;
        width: 100%;
        border-radius: 0;
        margin: 0;
        padding: 0;
      }

      /* บีบอัดขนาดเพื่อให้อยู่ใน 1 หน้ากระดาษ */
      .top-bar {
        padding: 8px 16px !important;
      }

      .section {
        padding: 10px 16px !important;
      }

      .section-label {
        margin-bottom: 6px !important;
        font-size: 9px !important;
      }

      .field-row {
        margin-bottom: 6px !important;
        gap: 6px !important;
      }

      .field .value {
        min-height: 26px !important;
        padding: 4px 8px !important;
        font-size: 11px !important;
      }

      .check-item {
        padding: 4px 8px !important;
        gap: 4px !important;
        border-width: 1px !important;
      }

      .check-text {
        font-size: 11px !important;
      }

      .sig-box {
        height: 80px !important;
        padding: 4px !important;
      }

      .sig-label {
        margin-top: 4px !important;
        font-size: 10px !important;
      }

      .doc-footer {
        padding: 8px 16px !important;
        border-radius: 0 !important;
      }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--navy);
      border-radius: 12px 12px 0 0;
      padding: 14px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text {
      color: white;
    }

    .brand-text .company {
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .brand-text .doc-type {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .doc-meta {
      text-align: right;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
    }

    .doc-id {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 500;
    }

    .page {
      background: white;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(27, 42, 74, 0.10);
      overflow: hidden;
    }

    .form-body {
      padding: 0;
    }

    .section {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-200);
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .field-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .field-row.full {
      grid-template-columns: 1fr;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-600);
      letter-spacing: 0.3px;
    }

    .field .value {
      font-size: 14px;
      font-weight: 500;
      color: var(--navy);
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      border-radius: 7px;
      padding: 8px 12px;
      min-height: 36px;
      line-height: 1.4;
      display: flex;
      align-items: center;
    }

    .field .value.highlight {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--blue);
      font-weight: 600;
      font-size: 13px;
      background: #EEF4FF;
      border-color: transparent;
    }

    .checklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .check-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-200);
    }

    .check-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .check-item.checked {
      background: var(--green-bg);
      border-color: #A7DFC4;
    }

    .check-item.issue {
      background: var(--red-bg);
      border-color: #FABBB6;
    }

    .check-item.noted {
      background: #FEF3C7;
      border-color: #FBBF24;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .checked .check-icon {
      background: var(--green);
      color: white;
    }

    .issue .check-icon {
      background: var(--red);
      color: white;
    }

    .noted .check-icon {
      background: #D97706;
      color: white;
    }

    .check-text {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
    }

    .check-result {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .checked .check-result {
      background: var(--green);
      color: white;
    }

    .issue .check-result {
      background: var(--red);
      color: white;
    }

    .noted .check-result {
      background: #D97706;
      color: white;
    }

    .check-note {
      font-size: 12px;
      color: var(--gray-600);
      background: rgba(255, 255, 255, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .sig-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      text-align: center;
    }

    .sig-box {
      border: 1.5px dashed var(--gray-400);
      border-radius: 8px;
      padding: 10px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-100);
    }

    .sig-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .sig-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-600);
      margin-top: 8px;
    }

    .doc-footer {
      background: var(--navy);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 0 0 12px 12px;
    }

    .doc-footer .left {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .doc-footer .right {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--gold-light);
    }

    .actions {
      max-width: 680px;
      margin: 16px auto 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      width: 100%;
    }

    .btn-primary {
      background: var(--navy);
      color: white;
    }

    .btn-primary:hover {
      background: var(--navy-mid);
    }

    .btn-outline {
      background: white;
      color: var(--navy);
      border: 1.5px solid var(--gray-200);
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-logo" style="background:transparent; padding:0;">
          <img src="../img/logo-1.jpg" onerror="this.src='../Backend/logo-1.jpg'"
            style="width:100%;height:100%;object-fit:cover;border-radius:8px;">
        </div>
        <div class="brand-text">
          <div class="company">NEXGEN SYSTEM CENTER</div>
          <div class="doc-type">รายงานการเข้าพบผู้ว่าจ้าง (OP05)</div>
        </div>
      </div>
      <div class="doc-meta">
        <div class="doc-id" id="v-docId">กำลังโหลด...</div>
        <div style="margin-top:3px;" id="v-docDate">...</div>
      </div>
    </div>

    <div class="form-body">
      <!-- SECTION 1 -->
      <div class="section">
        <div class="section-label">ข้อมูลการเข้าพบ</div>
        <div class="field-row">
          <div class="field">
            <label>วันที่</label>
            <div class="value highlight" id="v-visitDate">-</div>
          </div>
          <div class="field">
            <label>เวลา</label>
            <div class="value highlight" id="v-timeIn">-</div>
          </div>
        </div>
        <div class="field-row full">
          <div class="field">
            <label>หน่วยงาน (Site Name)</label>
            <div class="value" id="v-siteName">-</div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>ผู้ว่าจ้าง (Client)</label>
            <div class="value" id="v-client">-</div>
          </div>
          <div class="field">
            <label>เจ้าหน้าที่ (Officer)</label>
            <div class="value" id="v-officer">-</div>
          </div>
        </div>
      </div>

      <!-- SECTION 2 -->
      <div class="section">
        <div class="section-label">รายละเอียดการประชุม (Meeting Details)</div>
        <div class="checklist" id="v-checklistArea">
          <!-- JS generated -->
        </div>
      </div>

      <!-- SECTION 3 -->
      <div class="section" style="page-break-inside: avoid;">
        <div class="section-label">การรับรองเอกสาร (Signatures)</div>
        <div class="sig-grid">
          <div>
            <div class="sig-box"><img id="v-sigClient" src="" style="display:none;"></div>
            <div class="sig-label">ลายมือชื่อผู้ว่าจ้าง</div>
          </div>
          <div>
            <div class="sig-box"><img id="v-sigStaff" src="" style="display:none;"></div>
            <div class="sig-label">ลายมือชื่อเจ้าหน้าที่ (สายตรวจ/หน.ชุด)</div>
          </div>
        </div>
      </div>
    </div>

    <div class="doc-footer">
      <div class="left">NEXGEN SYSTEM CENTER</div>
      <div class="right">OP05 | v1.0</div>
    </div>
  </div>

  <div class="actions no-print">
    <button class="btn btn-outline" style="flex:1" onclick="window.close()">ปิดหน้านี้</button>
    <button class="btn btn-primary" style="flex:2" onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('id');

    window.onload = async () => {
      if (!docId) { alert('ไม่พบข้อมูลอ้างอิงเอกสาร'); return; }
      await fetchDoc();
    };

    const CHECKLIST_MAP = {
      manpower: "ด้านกำลังพล (ขาด/เกิน, การจัดสายตรวจ)",
      discipline: "ด้านระเบียบวินัย (เครื่องแต่งกาย, กริยามารยาท)",
      quality: "ด้านคุณภาพการปฏิบัติงาน (หลับยาม, ทิ้งจุด)",
      equipment: "ด้านอุปกรณ์และเทคโนโลยี (วิทยุ, กล้อง, แอป)",
      personnel: "ด้านข้อมูลและประวัติพนักงาน",
      inspection: "ด้านการตรวจ / ความถี่ของสายตรวจ",
      complaint: "ข้อร้องเรียนอื่นๆ",
      suggestion: "คำแนะนำและความต้องการของผู้ว่าจ้าง"
    };

    async function fetchDoc() {
      const { data, error } = await supabaseClient.from('op05_reports').select('*').eq('id', docId).single();
      if (error || !data) { alert('เกิดข้อผิดพลาด หรือไม่พบเอกสารนี้ในฐานข้อมูล'); return; }

      document.getElementById('v-docId').innerText = data.doc_id || '-';
      document.getElementById('v-docDate').innerText = 'สร้างเมื่อ: ' + new Date(data.created_at).toLocaleString('th-TH');

      // Format Date to BE
      let formattedDate = data.visit_date || '-';
      if (data.visit_date && data.visit_date !== '-') {
          const [y, m, d] = data.visit_date.split('-');
          formattedDate = `${d}/${m}/${parseInt(y) + 543}`;
      }
      document.getElementById('v-visitDate').innerText = formattedDate;
      document.getElementById('v-timeIn').innerText = (data.visit_time || '-') + ' น.';
      document.getElementById('v-siteName').innerText = data.site_name || '-';
      document.getElementById('v-client').innerText = data.client_name || '-';
      document.getElementById('v-officer').innerText = data.op_name || '-';

      // Checklist
      const checkArea = document.getElementById('v-checklistArea');
      const cl = data.checklist || {};

      // Convert to array and filter out items without status
      const items = Object.keys(CHECKLIST_MAP).map(key => {
        const entry = cl[key];
        if (!entry || !entry.status) return null;
        return { key, label: CHECKLIST_MAP[key], status: entry.status, note: entry.note || '' };
      }).filter(Boolean);

      if (items.length === 0) {
        checkArea.innerHTML = '<div style="text-align:center; padding:10px; color:var(--gray-400);">ไม่มีข้อมูลการประชุม</div>';
      } else {
        checkArea.innerHTML = items.map(item => {
          let statusClass = 'checked', iconText = '✓', resText = 'ปกติ';
          if (item.status === 'issue') { statusClass = 'issue'; iconText = '✗'; resText = 'พบปัญหา'; }
          else if (item.status === 'discuss') { statusClass = 'noted'; iconText = '!'; resText = 'หารือ'; }

          let noteHtml = item.note ? `<div class="check-note"><b>รายละเอียด:</b> ${item.note}</div>` : '';

          return `
                <div class="check-item ${statusClass}">
                  <div class="check-item-top">
                    <div style="display:flex; align-items:center; gap:10px;">
                      <div class="check-icon">${iconText}</div>
                      <div class="check-text">${item.label}</div>
                    </div>
                    <div class="check-result">${resText}</div>
                  </div>
                  ${noteHtml}
                </div>`;
        }).join('');
      }

      // Signatures
      if (data.sig_client) {
        const img = document.getElementById('v-sigClient');
        img.src = data.sig_client;
        img.style.display = 'block';
      }
      if (data.sig_staff) {
        const img = document.getElementById('v-sigStaff');
        img.src = data.sig_staff;
        img.style.display = 'block';
      }
    }
  </script>
</body>

</html>
