<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nextgen | ระบบระบุพิกัดหน่วยงาน</title>

    <!-- Dependencies -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0ea5e9;
            --accent: #f59e0b;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.9);
        }

        body {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- SCANNING ANIMATION --- */
        .scan-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 40px;
        }

        .scan-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(14, 165, 233, 0.1);
            border-radius: 50%;
        }

        .scan-ring-active {
            position: absolute;
            inset: -10px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: spin 3s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .radar-line {
            position: absolute;
            top: 50%; left: 50%;
            width: 120px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary));
            transform-origin: left center;
            animation: radar 2s linear infinite;
        }

        @keyframes radar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pulse-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: rgba(14, 165, 233, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(14, 165, 233, 0.3);
        }

        .pulse-core i {
            font-size: 30px;
            color: var(--primary);
            animation: pulseIcon 2s infinite;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- STATUS CARD --- */
        .status-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .unit-name {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            margin-top: 10px;
            letter-spacing: -0.5px;
        }

        /* --- AI ASSISTANT STYLES --- */
        .ai-assistant-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 1000;
        }

        .ai-bubble {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.3);
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 13px;
            max-width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(14, 165, 233, 0.1);
            animation: fadeInRight 0.5s ease-out, bubble-glow 4s infinite;
            color: white;
            text-align: right;
        }

        .ai-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 30px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid rgba(30, 41, 59, 0.9);
        }

        @keyframes bubble-glow {
            0%, 100% { border-color: rgba(14, 165, 233, 0.3); }
            50% { border-color: rgba(14, 165, 233, 0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(14, 165, 233, 0.2); }
        }

        .ai-mascot-wrapper {
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: float-ai 4s ease-in-out infinite;
        }

        .ai-video-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: normal;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
        }

        @keyframes float-ai {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- MOBILE RESPONSIVE ADAPTATIONS FOR AI ASSISTANT --- */
        @media (max-width: 640px) {
            .ai-assistant-container {
                bottom: 10px;
                right: 10px;
                gap: 5px;
            }
            .ai-mascot-wrapper {
                width: 65px;
                height: 65px;
            }
            .ai-bubble {
                max-width: 165px;
                font-size: 10px;
                padding: 8px 12px;
                border-radius: 12px;
            }
            .ai-bubble::after {
                bottom: -6px;
                right: 15px;
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-top: 6px solid rgba(30, 41, 59, 0.9);
            }
        }
    </style>
</head>

<body>

    <div class="scan-container">
        <div class="scan-ring"></div>
        <div class="scan-ring-active"></div>
        <div class="radar-line" id="radar"></div>
        <div class="pulse-core">
            <i class="fas fa-satellite-dish" id="statusIcon"></i>
        </div>
    </div>

    <div class="status-card">
        <p class="text-[10px] font-black text-slate-500 uppercase tracking-[4px] mb-2" id="statusLabel">ระบบกำลังระบุพิกัด</p>
        <h2 class="text-2xl font-black text-white" id="mainStatus">ค้นหาหน่วยงาน...</h2>
        
        <div id="unitInfo" class="hidden">
            <!-- Dynamic Content Injected Here -->
        </div>

        <p id="retryText" class="mt-4 text-[10px] text-slate-500 hidden cursor-pointer hover:text-white underline" onclick="location.reload()">
            ไม่พบหน่วยงาน? กดลองใหม่อีกครั้ง
        </p>
    </div>

    <!-- Premium Footer -->
    <div class="mt-8 text-center pb-6 space-y-1">
        <p class="text-[10px] text-white font-black uppercase tracking-[2px]">NEXTGEN <span class="text-amber-500">SYSTEM CENTER</span></p>
        <p class="text-[8px] text-slate-500 font-bold tracking-[1px] opacity-60">
            <span class="uppercase">&copy; 2026 &bull; NEXTGEN SYSTEM CENTER</span> <span class="ml-1">Ver.1.0</span>
        </p>
        <span class="text-[7px] text-slate-700 block">Developer: Ponchai Onkum</span>
    </div>

    <!-- AI ASSISTANT -->
    <div class="ai-assistant-container">
        <div class="ai-bubble" id="aiBubbleText">
            สวัสดีค่ะ! <b>Nextgen-AI</b> <br>พร้อมบันทึกพิกัดให้คุณแล้วค่ะ
        </div>
        <div class="ai-mascot-wrapper">
            <img src="img/avata-checkin.png?v=1" class="ai-video-avatar" id="aiImage" alt="AI Assistant">
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const SUPABASE_URL = 'https://mvcsbylbsffgbkocehzx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Y3NieWxic2ZmZ2Jrb2NlaHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjI2NzgsImV4cCI6MjA5MTg5ODY3OH0.pxuSq1TuaSetJZAabrSPqXy6RAXAwaI_VWZ9zf5TypI';
        
        let supabaseClient;
        let currentMatch = null;
        let userData = null;
        let matchedUnitsList = [];

        // --- 2. AUTHENTICATION & LIFF AUTO-LOGIN ---
        const LIFF_ID = '2010305006-snZGIJEw';

        async function checkAuthAndInit() {
            if (typeof supabase === 'undefined') {
                alert("Network Error: Supabase failed to load.");
                return;
            }
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            try {
                // 1. ตรวจสอบ Session เดิมในเครื่องก่อน
                let sessionString = localStorage.getItem('nextgen_user');
                if (!sessionString && sessionStorage.getItem('nextgen_user')) {
                    localStorage.setItem('nextgen_user', sessionStorage.getItem('nextgen_user'));
                    sessionString = sessionStorage.getItem('nextgen_user');
                }

                if (sessionString) {
                    userData = JSON.parse(sessionString);
                    const userLevel = (userData.level || '').toLowerCase();
                    const allowedRoles = ['supervisor', 'guard', 'admin', 'manager'];
                    if (allowedRoles.includes(userLevel)) {
                        console.log("Session active:", userData.name);
                        detectLocation();
                        return;
                    }
                }

                // 2. ถ้าไม่มี Session เดิม ให้ตรวจสอบว่าเปิดในแอป LINE หรือไม่ (LIFF Client)
                if (typeof liff !== 'undefined') {
                    try {
                        updateAIText("กำลังเชื่อมต่อระบบ LINE...");
                        await liff.init({ liffId: LIFF_ID });

                        if (liff.isInClient()) {
                            if (!liff.isLoggedIn()) {
                                liff.login();
                                return;
                            }

                            updateAIText("กำลังตรวจสอบข้อมูลพนักงาน...");
                            const profile = await liff.getProfile();
                            const lineUserId = profile.userId;

                            // ค้นหารายชื่อจากฐานข้อมูลผ่าน line_user_id
                            const { data, error } = await supabaseClient
                                .from('staff')
                                .select('*')
                                .eq('line_user_id', lineUserId)
                                .single();

                            if (error || !data) {
                                // ถ้ายังไม่ได้ลงทะเบียน LINE
                                updateAIText("❌ คุณยังไม่ได้ลงทะเบียนใช้งาน LINE OA นี้ค่ะ<br>กำลังพาท่านไปหน้าลงทะเบียน...");
                                setTimeout(() => {
                                    window.location.replace('Frontend/RegisterLine.html');
                                }, 2500);
                                return;
                            }

                            if (data.status === 'ปิด') {
                                alert("บัญชีของคุณถูกระงับการใช้งาน");
                                window.location.replace('index.html');
                                return;
                            }

                            // บันทึก Session
                            localStorage.setItem('nextgen_user', JSON.stringify(data));
                            sessionStorage.setItem('nextgen_user', JSON.stringify(data));
                            userData = data;

                            console.log("LIFF Auto-login successful:", userData.name);
                            detectLocation();
                            return;
                        }
                    } catch (liffErr) {
                        console.warn("LIFF initialization skipped or failed:", liffErr);
                    }
                }

                // 3. ถ้าไม่มี Session และไม่ใช่การเปิดใน LINE ให้ส่งไปหน้า Login
                console.log("No session and not in LINE Client. Redirecting to login page...");
                localStorage.removeItem('nextgen_user');
                window.location.replace('index.html');

            } catch (e) {
                console.error("Access Denied / Auth Error:", e.message);
                localStorage.removeItem('nextgen_user');
                window.location.replace('index.html');
            }
        }

        // --- 3. GPS LOGIC ---
        function detectLocation() {
            if (!navigator.geolocation) {
                document.getElementById('mainStatus').innerText = 'ไม่รองรับ GPS';
                updateAIText("อุปกรณ์ของคุณไม่รองรับการระบุพิกัด GPS ค่ะ");
                return;
            }

            updateAIText("กำลังสแกนหาพิกัดของคุณ... <br>โปรดรอสักครู่นะคะ");

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const myLat = pos.coords.latitude;
                const myLng = pos.coords.longitude;
                console.log(`GPS FIX: ${myLat}, ${myLng}`);

                try {
                    const { data: units, error } = await supabaseClient.from('units').select('*');
                    if (error) throw error;

                    let matchedUnits = [];
                    units.forEach(u => {
                        // คัดกรองเฉพาะหน่วยงานที่เปิดทำการเท่านั้น (status !== 'ปิด')
                        if (u.status !== 'ปิด' && u.latitude && u.longitude) {
                            const uLat = parseFloat(u.latitude);
                            const uLng = parseFloat(u.longitude);
                            const distance = calculateDistance(myLat, myLng, uLat, uLng);
                            const radius = parseFloat(u.radius_meters) || 300;
                            
                            if (distance <= radius) matchedUnits.push(u);
                        }
                    });

                    if (matchedUnits.length === 1) {
                        showMatch(matchedUnits[0], myLat, myLng);
                    } else if (matchedUnits.length > 1) {
                        showSelection(matchedUnits, myLat, myLng);
                    } else {
                        showNoMatch(myLat, myLng);
                    }
                } catch (e) {
                    console.error("DB Error:", e);
                    updateAIText("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูลค่ะ");
                    showNoMatch(myLat, myLng);
                }
            }, (err) => {
                console.error("GPS Error:", err);
                let reason = "โปรดเปิด GPS และอนุญาตสิทธิ์การเข้าถึงพิกัดนะคะ";
                if(err.code === 1) reason = "คุณปฏิเสธการเข้าถึง GPS โปรดตั้งค่าอนุญาตนะคะ";
                if(err.code === 3) reason = "ค้นหาพิกัดนานเกินไป โปรดลองใหม่อีกครั้งค่ะ";
                
                document.getElementById('mainStatus').innerText = "ระบุพิกัดไม่สำเร็จ";
                updateAIText(reason);
                showNoMatch();
            }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // --- 4. DATA RECORDING ---
        async function showMatch(unit, lat, lng) {
            currentMatch = unit;
            let nextAction = 'check_in';
            let actionText = 'เข้า';
            
            try {
                const { data: lastLog, error } = await supabaseClient
                    .from('duty_logs')
                    .select('action_type')
                    .eq('emp_id', userData.emp_id)
                    .eq('unit_name', unit.unit_name)
                    .order('timestamp', { ascending: false })
                    .limit(1);

                if (!error && lastLog && lastLog.length > 0) {
                    if (lastLog[0].action_type === 'check_in') {
                        nextAction = 'check_out';
                        actionText = 'ออก';
                    }
                }

                // Check for Early Check-out (Guard Only)
                const userLevel = (userData.level || '').toLowerCase();
                if (nextAction === 'check_out' && userLevel === 'guard') {
                    const now = new Date();
                    const hour = now.getHours();
                    let isEarly = false;
                    let shiftTime = "";
                    
                    if (hour >= 7 && hour < 19) { isEarly = true; shiftTime = "19:00 น."; }
                    else if (hour >= 19 || hour < 7) { isEarly = true; shiftTime = "07:00 น."; }

                    if (isEarly) {
                        const cleanName = userData.name.split(' ')[0];
                        
                        // Ensure AI assistant is visible if it was hidden during selection
                        const aiContainer = document.querySelector('.ai-assistant-container');
                        if (aiContainer) {
                            aiContainer.style.display = 'flex';
                            aiContainer.style.opacity = '1';
                            aiContainer.style.transform = 'none';
                            aiContainer.style.pointerEvents = 'auto';
                        }

                        updateAIText(`<span class="text-rose-400 font-bold">⚠️ คำเตือน!</span><br>คุณ <b>${cleanName}</b> กำลังจะบันทึกออกงานก่อนเวลานะคะ (เลิกงานคือ ${shiftTime})`);
                        
                        const unitInfoDiv = document.getElementById('unitInfo');
                        unitInfoDiv.innerHTML = `
                            <p class="unit-name">${unit.unit_name}</p>
                            <div class="mt-6 p-4 rounded-2xl bg-amber-500/20 border border-amber-500/30 text-amber-400 shadow-lg">
                                <p class="text-xs font-bold mb-3">ต้องการยืนยันการออกก่อนเวลาหรือไม่?</p>
                                <div class="flex gap-2">
                                    <button onclick="executeRecord('${nextAction}', '${actionText}', ${lat}, ${lng})" class="flex-1 py-3 bg-amber-500 text-white rounded-xl font-bold text-[10px] uppercase">ยืนยันออกงาน</button>
                                    <button onclick="location.reload()" class="flex-1 py-3 bg-slate-700 text-white rounded-xl font-bold text-[10px] uppercase">ยกเลิก</button>
                                </div>
                            </div>
                        `;
                        unitInfoDiv.classList.remove('hidden');
                        document.getElementById('radar').style.animation = 'none';
                        document.getElementById('statusIcon').className = 'fas fa-exclamation-triangle text-amber-500';
                        document.getElementById('mainStatus').innerText = 'พบการออกก่อนเวลา';
                        return;
                    }
                }

                await executeRecord(nextAction, actionText, lat, lng);

            } catch (e) {
                console.error("Recording Exception:", e);
                alert("ระบบขัดข้อง! กรุณาตรวจสอบการเชื่อมต่อ");
            }
        }

        async function executeRecord(nextAction, actionText, lat, lng) {
            const thaiNow = getThaiISOString();
            try {
                const { error: insertError } = await supabaseClient
                    .from('duty_logs')
                    .insert([{
                        emp_id: userData.emp_id,
                        name: userData.name,
                        role: userData.level || userData.role,
                        unit_name: currentMatch.unit_name,
                        action_type: nextAction,
                        gps_location: `${lat},${lng}`,
                        timestamp: thaiNow,
                        note: 'บันทึกผ่านระบบ AI Assistant'
                    }]);

                if (insertError) throw insertError;
                updateAIText(`บันทึก <b>${actionText}งาน</b> เรียบร้อยแล้วค่ะ<br>ขอให้เดินทางปลอดภัยนะคะ`);
                updateUIForMatch(currentMatch, nextAction, actionText);
            } catch (e) {
                alert("บันทึกข้อมูลไม่สำเร็จ!");
            }
        }

        // --- 5. UI UPDATES ---
        function showSelection(units, lat, lng) {
            matchedUnitsList = units; // บันทึกรายชื่อหน่วยงานลงอาเรย์โกลบอลเพื่อความแม่นยำสูง 100%

            document.getElementById('radar').style.animation = 'none';
            document.getElementById('statusIcon').className = 'fas fa-layer-group text-amber-500';
            document.getElementById('statusLabel').innerText = 'พบหลายหน่วยงาน';
            document.getElementById('mainStatus').innerText = 'กรุณาเลือกหน่วยงาน';

            // Hide AI Assistant container to prevent blocking selection buttons on mobile
            const aiContainer = document.querySelector('.ai-assistant-container');
            if (aiContainer) {
                aiContainer.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                aiContainer.style.opacity = '0';
                aiContainer.style.transform = 'translateY(20px)';
                aiContainer.style.pointerEvents = 'none';
                setTimeout(() => {
                    aiContainer.style.display = 'none';
                }, 500);
            }

            const unitInfoDiv = document.getElementById('unitInfo');
            let html = '<div class="mt-4 space-y-3">';
            units.forEach((u, index) => {
                html += `
                    <button onclick="selectUnitFromList(${index}, ${lat}, ${lng})" 
                        class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-left hover:bg-sky-500/20 hover:border-sky-500/50 transition-all active:scale-95">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="text-white font-bold text-sm">${u.unit_name}</div>
                                <div class="text-[9px] text-slate-500 uppercase tracking-widest">${u.unit_code || 'UNIT'}</div>
                            </div>
                            <i class="fas fa-chevron-right text-sky-500"></i>
                        </div>
                    </button>`;
            });
            html += '</div>';
            unitInfoDiv.innerHTML = html;
            unitInfoDiv.classList.remove('hidden');
        }

        function selectUnitFromList(index, lat, lng) {
            if (matchedUnitsList && matchedUnitsList[index]) {
                showMatch(matchedUnitsList[index], lat, lng);
            }
        }

        function updateUIForMatch(unit, nextAction, actionText) {
            document.getElementById('radar').style.animation = 'none';
            document.getElementById('statusIcon').className = 'fas fa-check-circle text-emerald-500';
            document.getElementById('statusLabel').innerText = 'ระบุพิกัดสำเร็จ';
            document.getElementById('mainStatus').innerText = `บันทึก${actionText}งานเรียบร้อย`;

            // Hide AI Assistant container completely to prevent blocking the dashboard button on mobile
            const aiContainer = document.querySelector('.ai-assistant-container');
            if (aiContainer) {
                aiContainer.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                aiContainer.style.opacity = '0';
                aiContainer.style.transform = 'translateY(20px)';
                aiContainer.style.pointerEvents = 'none';
                setTimeout(() => {
                    aiContainer.style.display = 'none';
                }, 500);
            }
            
            const unitInfoDiv = document.getElementById('unitInfo');
            const colorClass = nextAction === 'check_in' ? 'emerald' : 'amber';
            const iconClass = nextAction === 'check_in' ? 'fa-sign-in-alt' : 'fa-sign-out-alt';
            
            let bottomMenu = nextAction === 'check_in' ? `
                <div class="mt-8 space-y-3">
                    <button onclick="goToPortal()" class="w-full py-4 bg-sky-600 text-white rounded-2xl font-bold text-sm tracking-widest shadow-lg shadow-sky-900/20 active:scale-95 transition-all">
                        <i class="fas fa-chart-pie mr-2"></i> ไปหน้าแดชบอร์ด
                    </button>
                    <button onclick="logout()" class="w-full py-4 bg-slate-800/50 text-slate-300 border border-white/10 rounded-2xl font-bold text-sm tracking-widest active:scale-95 transition-all">
                        <i class="fas fa-sign-out-alt mr-2"></i> กลับหน้า Login
                    </button>
                </div>` : `
                <div class="mt-8 space-y-3">
                    <p class="text-[10px] font-bold text-rose-500 animate-pulse mb-4 uppercase">Clock-Out Sequence Completed</p>
                    <button onclick="logout()" class="w-full py-4 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-2xl font-bold text-sm tracking-widest active:scale-95 transition-all">
                        <i class="fas fa-sign-out-alt mr-2"></i> กลับสู่หน้าหลัก
                    </button>
                </div>`;

            unitInfoDiv.innerHTML = `
                <p class="unit-name">${unit.unit_name}</p>
                <div class="mt-6 p-4 rounded-2xl bg-${colorClass}-500/20 border border-${colorClass}-500/30 text-${colorClass}-400">
                    <i class="fas ${iconClass} text-2xl mb-2 block"></i>
                    <span class="font-black text-[11px] uppercase tracking-widest">Success: ${actionText}งาน</span>
                </div>
                ${bottomMenu}`;
            unitInfoDiv.classList.remove('hidden');
        }

        function showNoMatch(lat, lng) {
            document.getElementById('radar').style.animation = 'none';
            document.getElementById('statusIcon').className = 'fas fa-times-circle text-rose-500';
            document.getElementById('mainStatus').innerText = 'ไม่พบหน่วยงาน';
            document.getElementById('retryText').classList.remove('hidden');

            if (lat && lng) {
                updateAIText(`ขออภัยค่ะ ไม่พบหน่วยงานในรัศมีใกล้เคียง<br><span class="text-[10px] text-slate-400 italic">GPS Fix: ${lat.toFixed(6)}, ${lng.toFixed(6)}</span>`);
            } else {
                updateAIText("ไม่สามารถระบุพิกัดได้ โปรดตรวจสอบการตั้งค่า GPS นะคะ");
            }
        }

        function updateAIText(text) {
            const bubble = document.getElementById('aiBubbleText');
            if (bubble) bubble.innerHTML = text;
        }

        // --- 6. UTILITIES ---
        function getThaiISOString() {
            const now = new Date();
            const tzOffset = 7 * 60 * 60 * 1000;
            const localTime = new Date(now.getTime() + tzOffset);
            return localTime.toISOString().split('.')[0].slice(0, 19) + '+07:00';
        }

        function goToPortal() {
            const user = JSON.parse(localStorage.getItem('nextgen_user'));
            const level = user ? user.level.toLowerCase() : '';
            if (level === 'admin' || level === 'manager') window.location.href = 'Backend/dashboard.html';
            else if (level === 'supervisor') window.location.href = 'Frontend/staff.html';
            else window.location.href = 'Frontend/guard.html';
        }

        function logout() {
            localStorage.removeItem('nextgen_user');
            window.location.replace('index.html');
        }

        window.onload = () => {
            checkAuthAndInit();
        };
    </script>
</body>
</html>
