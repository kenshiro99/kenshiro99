<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexgen | ระบบระบุพิกัดหน่วยงาน</title>

    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0ea5e9;
            --accent: #f59e0b;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.9);
        }

        body {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- SCANNING ANIMATION --- */
        .scan-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 40px;
        }

        .scan-ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(14, 165, 233, 0.1);
            border-radius: 50%;
        }

        .scan-ring-active {
            position: absolute;
            inset: -10px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: spin 3s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .radar-line {
            position: absolute;
            top: 50%; left: 50%;
            width: 120px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary));
            transform-origin: left center;
            animation: radar 2s linear infinite;
        }

        @keyframes radar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pulse-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: rgba(14, 165, 233, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(14, 165, 233, 0.3);
        }

        .pulse-core i {
            font-size: 30px;
            color: var(--primary);
            animation: pulseIcon 2s infinite;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- STATUS CARD --- */
        .status-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .unit-name {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            margin-top: 10px;
            letter-spacing: -0.5px;
        }

        .check-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 25px;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body>

    <div class="scan-container">
        <div class="scan-ring"></div>
        <div class="scan-ring-active"></div>
        <div class="radar-line" id="radar"></div>
        <div class="pulse-core">
            <i class="fas fa-satellite-dish" id="statusIcon"></i>
        </div>
    </div>

    <div class="status-card">
        <p class="text-[10px] font-black text-slate-500 uppercase tracking-[4px] mb-2" id="statusLabel">ระบบกำลังระบุพิกัด</p>
        <h2 class="text-2xl font-black text-white" id="mainStatus">ค้นหาหน่วยงาน...</h2>
        <div id="unitInfo" class="hidden">
            <p class="unit-name" id="detectedUnitName">-- ชื่อหน่วยงาน --</p>
            <p class="text-emerald-400 text-xs font-bold mt-2"><i class="fas fa-check-circle mr-1"></i> บันทึกเข้าหน่วยงานแล้ว</p>
        </div>

        <div id="actionButtons" class="hidden mt-6 space-y-3 w-full">
            <button onclick="recordTime('in')" class="w-full py-4 bg-emerald-500 rounded-2xl text-white font-black text-sm uppercase tracking-widest shadow-[0_10px_20px_rgba(16,185,129,0.3)] active:scale-95 transition-all">
                <i class="fas fa-sign-in-alt mr-2"></i> ลงเวลาเข้างาน
            </button>
            <button onclick="recordTime('out')" class="w-full py-4 bg-amber-500 rounded-2xl text-white font-black text-sm uppercase tracking-widest shadow-[0_10px_20px_rgba(245,158,11,0.3)] active:scale-95 transition-all">
                <i class="fas fa-sign-out-alt mr-2"></i> ลงเวลาออกงาน
            </button>
        </div>

        <p id="retryText" class="mt-4 text-[10px] text-slate-500 hidden cursor-pointer hover:text-white underline" onclick="location.reload()">
            ไม่พบหน่วยงาน? กดลองใหม่อีกครั้ง
        </p>
    </div>

    <!-- Premium Footer -->
    <div class="mt-8 text-center pb-6 space-y-1">
        <p class="text-[10px] text-white font-black uppercase tracking-[2px]">NEXGEN <span class="text-amber-500">SYSTEM CENTER</span></p>
        <p class="text-[8px] text-slate-500 font-bold tracking-[1px] opacity-60">
            <span class="uppercase">&copy; 2026 &bull; NEXGEN SYSTEM CENTER</span> <span class="ml-1">Ver.1.0</span>
        </p>
        <span class="text-[7px] text-slate-700 block">Developer: Ponchai Onkum</span>
    </div>

    <script>
        // --- Configuration & Global State ---
        const SUPABASE_URL = 'https://mvcsbylbsffgbkocehzx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Y3NieWxic2ZmZ2Jrb2NlaHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjI2NzgsImV4cCI6MjA5MTg5ODY3OH0.pxuSq1TuaSetJZAabrSPqXy6RAXAwaI_VWZ9zf5TypI';
        
        let supabaseClient;
        let currentMatch = null;
        let userData = null;

        /**
         * Authentication & Access Control
         * Bounces unauthorized users back to login
         */
        function checkAuth() {
            try {
                const sessionString = localStorage.getItem('nexgen_user');
                if (!sessionString) throw new Error('No session');
                
                userData = JSON.parse(sessionString);
                const userLevel = (userData.level || '').toLowerCase();
                
                // Allowed roles for this page
                const allowedRoles = ['supervisor', 'guard', 'admin', 'manager'];
                if (!allowedRoles.includes(userLevel)) throw new Error('Unauthorized');
                
            } catch (e) {
                console.error("Access Denied:", e.message);
                localStorage.removeItem('nexgen_user');
                window.location.replace('index.html');
            }
        }

        /**
         * Initialization on page load
         */
        window.onload = () => {
            checkAuth(); // Verify user first

            if (typeof supabase === 'undefined') {
                alert("เกิดข้อผิดพลาดในการโหลดระบบ กรุณาลองใหม่อีกครั้ง");
                return;
            }

            // Initialize Supabase Client
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            // Start GPS Detection
            detectLocation();
        };

        // --- Core Functions ---


        function detectLocation() {
            if (!navigator.geolocation) {
                document.getElementById('mainStatus').innerText = 'ไม่รองรับ GPS';
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const myLat = pos.coords.latitude;
                const myLng = pos.coords.longitude;

                try {
                    const { data: units, error } = await supabaseClient.from('units').select('*');
                    if (error) throw error;

                    let matchedUnits = [];
                    units.forEach(u => {
                        if (u.latitude && u.longitude) {
                            const distance = calculateDistance(myLat, myLng, u.latitude, u.longitude);
                            const radius = u.radius_meters || 100;
                            if (distance <= radius) matchedUnits.push(u);
                        }
                    });

                    if (matchedUnits.length === 1) {
                        // กรณีเจอที่เดียว: บันทึกอัตโนมัติเหมือนเดิม
                        showMatch(matchedUnits[0], myLat, myLng);
                    } else if (matchedUnits.length > 1) {
                        // กรณีเจอหลายที่: แสดงรายการให้เลือก
                        showSelection(matchedUnits, myLat, myLng);
                    } else {
                        showNoMatch();
                    }
                } catch (e) {
                    console.error("Database Error:", e);
                    showNoMatch();
                }
            }, (err) => {
                console.error("GPS Error:", err);
                document.getElementById('mainStatus').innerText = "โปรดอนุญาตสิทธิ์การเข้าถึง GPS";
                showNoMatch();
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        /**
         * Helper to get current Thai time in ISO format with +07:00 offset
         */
        function getThaiISOString() {
            const now = new Date();
            // Adjust to UTC+7
            const tzOffset = 7 * 60 * 60 * 1000; // 7 hours in ms
            const localTime = new Date(now.getTime() + tzOffset);
            return localTime.toISOString().split('.')[0].slice(0, 19) + '+07:00';
        }

        async function showMatch(unit, lat, lng) {
            currentMatch = unit;
            
            // 1. ตรวจสอบสถานะล่าสุดจากฐานข้อมูลจริง (Supabase)
            let nextAction = 'check_in';
            let actionText = 'เข้า';
            const thaiNow = getThaiISOString();
            
            try {
                const { data: lastLog, error } = await supabaseClient
                    .from('duty_logs')
                    .select('action_type')
                    .eq('emp_id', userData.emp_id)
                    .eq('unit_name', unit.unit_name)
                    .order('timestamp', { ascending: false })
                    .limit(1);

                if (!error && lastLog && lastLog.length > 0) {
                    if (lastLog[0].action_type === 'check_in') {
                        nextAction = 'check_out';
                        actionText = 'ออก';
                    }
                }

                // 2. บันทึกข้อมูลลงฐานข้อมูลจริง
                const { error: insertError } = await supabaseClient
                    .from('duty_logs')
                    .insert([{
                        emp_id: userData.emp_id,
                        name: userData.name,
                        role: userData.level || userData.role,
                        unit_name: unit.unit_name,
                        action_type: nextAction,
                        gps_location: `${lat},${lng}`,
                        timestamp: thaiNow, // บันทึกเวลาไทยมาตรฐานเดียวกับ Supervisor
                        note: 'บันทึกอัตโนมัติผ่านพิกัด GPS'
                    }]);

                if (insertError) throw insertError;

            } catch (e) {
                console.error("Recording Exception:", e);
                alert("บันทึกข้อมูลล้มเหลว! กรุณาตรวจสอบการเชื่อมต่อ");
            }

            // --- อัปเดต UI ---
            updateUIForMatch(unit, nextAction, actionText);
        }

        /**
         * Show selection screen when multiple units are found
         */
        function showSelection(units, lat, lng) {
            document.getElementById('radar').style.animation = 'none';
            document.getElementById('statusIcon').className = 'fas fa-layer-group text-amber-500';
            document.getElementById('statusLabel').innerText = 'พบหลายหน่วยงาน';
            document.getElementById('mainStatus').innerText = 'กรุณาเลือกหน่วยงานที่ต้องการบันทึก';

            const unitInfoDiv = document.getElementById('unitInfo');
            let html = '<div class="mt-4 space-y-3">';
            
            units.forEach(u => {
                html += `
                    <button onclick="showMatch(${JSON.stringify(u).replace(/"/g, '&quot;')}, ${lat}, ${lng})" 
                        class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-left hover:bg-primary/20 hover:border-primary/50 transition-all active:scale-95">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="text-white font-bold text-sm">${u.unit_name}</div>
                                <div class="text-[10px] text-slate-500">${u.unit_code || 'UNIT'}</div>
                            </div>
                            <i class="fas fa-chevron-right text-primary"></i>
                        </div>
                    </button>
                `;
            });
            
            html += '</div>';
            unitInfoDiv.innerHTML = html;
            unitInfoDiv.classList.remove('hidden');
        }

        /**
         * Helper to update UI after recording
         */
        function updateUIForMatch(unit, nextAction, actionText) {
            document.getElementById('radar').style.animation = 'none';
            document.getElementById('statusIcon').className = 'fas fa-check-circle text-emerald-500';
            document.getElementById('statusLabel').innerText = 'ระบุพิกัดสำเร็จ';
            document.getElementById('mainStatus').innerText = `บันทึก${actionText}งานเรียบร้อยแล้ว`;
            
            const unitInfoDiv = document.getElementById('unitInfo');
            const colorClass = nextAction === 'check_in' ? 'emerald' : 'amber';
            const iconClass = nextAction === 'check_in' ? 'fa-sign-in-alt' : 'fa-sign-out-alt';
            
            let bottomMenu = '';
            
            if (nextAction === 'check_in') {
                // กรณีบันทึกเข้างาน
                bottomMenu = `
                    <div class="mt-8 space-y-3">
                        <button onclick="goToPortal()" class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-sm tracking-widest active:scale-95 transition-all shadow-lg shadow-primary/20">
                            <i class="fas fa-chart-pie mr-2"></i> ไปหน้าแดชบอร์ด
                        </button>
                        <button onclick="logout()" class="w-full py-4 bg-slate-800/50 text-slate-300 border border-white/10 rounded-2xl font-bold text-sm tracking-widest active:scale-95 transition-all">
                            <i class="fas fa-sign-out-alt mr-2"></i> กลับหน้า Login
                        </button>
                    </div>
                `;
            } else {
                // กรณีบันทึกออกงาน
                bottomMenu = `
                    <div class="mt-8 space-y-3">
                        <p class="text-sm font-bold text-rose-500 animate-pulse mb-4">ลงเวลาออกงานสำเร็จ</p>
                        <button onclick="logout()" class="w-full py-4 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-2xl font-bold text-sm tracking-widest active:scale-95 transition-all">
                            <i class="fas fa-sign-out-alt mr-2"></i> กลับสู่หน้าหลัก (Login)
                        </button>
                    </div>
                `;
            }

            unitInfoDiv.innerHTML = `
                <p class="unit-name">${unit.unit_name}</p>
                <div class="mt-6 p-4 rounded-2xl bg-${colorClass}-500/20 border border-${colorClass}-500/30 text-${colorClass}-400 shadow-lg">
                    <i class="fas ${iconClass} text-2xl mb-2 block"></i>
                    <span class="font-black text-[11px] uppercase tracking-widest">ลงเวลา${actionText}งานสำเร็จ</span>
                </div>
                ${bottomMenu}
            `;
            unitInfoDiv.classList.remove('hidden');
        }

        function showNoMatch() {
            document.getElementById('radar').style.animation = 'none';
            document.getElementById('statusIcon').className = 'fas fa-times-circle text-rose-500';
            document.getElementById('mainStatus').innerText = 'ไม่พบหน่วยงาน';
            document.getElementById('retryText').classList.remove('hidden');
        }

        function goToPortal() {
            const user = JSON.parse(localStorage.getItem('nexgen_user'));
            const userLevel = (user && user.level) ? user.level.toLowerCase() : '';

            if (userLevel === 'admin' || userLevel === 'manager') {
                window.location.href = 'Backend/dashboard.html';
            } else if (userLevel === 'supervisor') {
                // ส่งสายตรวจ/หัวหน้างานไปที่หน้า Staff
                window.location.href = 'Frontend/staff.html';
            } else {
                // ส่ง รปภ. ไปที่หน้า Guard
                window.location.href = 'Frontend/guard.html';
            }
        }

        function logout() {
            localStorage.removeItem('nexgen_user');
            window.location.replace('index.html');
        }
    </script>
</body>

</html>
