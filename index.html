<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nextgen ระบบพอร์ทัล | เข้าสู่ระบบ</title>

    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cyber-blue: #0ea5e9;
            --cyber-gold: #f59e0b;
            --cyber-dark: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --bg-gradient: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        body {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            background: var(--bg-gradient);
            color: white;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            transition: background 1s ease;
        }

        /* --- BACKGROUND ANIMATIONS --- */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 1) 100%);
        }

        .mesh-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
            pointer-events: none;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(14, 165, 233, 0.1);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(245, 158, 11, 0.05);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(100px, 100px);
            }
        }

        /* --- COMPONENTS --- */
        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(14, 165, 233, 0.05);
            display: block;
            animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ai-assistant-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ai-mascot-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            animation: float-ai 5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s ease;
        }

        .ai-bubble {
            position: relative;
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: bubble-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ai-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 12px solid rgba(30, 41, 59, 0.9);
        }

        /* --- LOGO & BRANDING --- */
        .brand-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            background: #0f172a;
            border-radius: 25px;
            border: 2px solid rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: pulse-border 4s ease-in-out infinite;
        }

        .brand-logo img {
            width: 85%;
            height: 85%;
            border-radius: 18px;
            object-fit: cover;
        }

        .cyber-title {
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(to bottom, #fff 40%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .cyber-subtitle {
            font-size: 10px;
            font-weight: 700;
            color: var(--cyber-blue);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        /* --- INPUTS & BUTTONS --- */
        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper label {
            position: absolute;
            left: 18px;
            top: -10px;
            background: #0f172a;
            padding: 0 6px;
            font-size: 9px;
            font-weight: 800;
            color: var(--cyber-blue);
            text-transform: uppercase;
            z-index: 10;
            border-radius: 4px;
        }

        .cyber-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(2, 6, 23, 0.4) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 16px;
            color: white !important;
            outline: none;
            transition: 0.3s;
        }

        .cyber-input:focus {
            border-color: var(--cyber-blue) !important;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
        }

        .cyber-input:focus+i {
            color: var(--cyber-blue);
        }

        .cyber-btn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .cyber-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .cyber-btn.mode-report {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
        }

        /* --- ANIMATIONS --- */
        @keyframes float-ai {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes bubble-pop {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse-border {

            0%,
            100% {
                border-color: rgba(14, 165, 233, 0.3);
            }

            50% {
                border-color: var(--cyber-gold);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            display: none;
        }

        .ai-video-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .ai-cursor {
            display: inline-block;
            width: 6px;
            height: 15px;
            background: var(--cyber-gold);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Smooth Effects */
        .ai-smoke-out {
            animation: smoke 0.4s ease-in forwards;
        }

        .ai-smoke-in {
            animation: smoke 0.4s ease-out reverse forwards;
        }

        @keyframes smoke {
            0% {
                opacity: 1;
                filter: blur(0);
            }

            100% {
                opacity: 0;
                filter: blur(20px);
                transform: scale(1.1);
            }
        }

        .ai-choice-btn {
            width: 100%;
            padding: 12px;
            background: rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 12px;
            color: #bae6fd;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            transition: 0.3s;
        }

        .ai-choice-btn:hover {
            background: rgba(14, 165, 233, 0.2);
            border-color: var(--cyber-blue);
            transform: translateX(5px);
        }

        /* Responsive refinements */
        @media (max-width: 1024px) {
            .ai-mascot-wrapper {
                width: 150px;
                height: 150px;
            }

            .ai-bubble {
                max-width: 380px;
                padding: 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 640px) {
            .ai-mascot-wrapper {
                width: 100px;
                height: 100px;
            }

            .ai-bubble {
                font-size: 12px;
                padding: 12px 16px;
                border-radius: 16px;
            }

            .login-card {
                padding: 28px 20px;
                border-radius: 24px;
            }

            .cyber-title {
                font-size: 20px;
                margin-bottom: 2px;
            }

            .cyber-subtitle {
                margin-bottom: 20px;
            }

            #mainGateway {
                gap: 16px !important;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <div class="mesh-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="mainGateway"
        class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 items-center justify-items-center">

        <!-- AI ASSISTANT (Always visible, handles greeting) -->
        <div class="ai-assistant-container order-1 lg:order-1" id="aiAssistant">
            <div class="ai-bubble" id="aiBubble">
                <div class="ai-text text-slate-200" id="aiText">
                    กำลังเตรียมระบบผู้ช่วย...
                </div>
                <div id="aiChoices" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 hidden">
                    <button class="ai-choice-btn" onclick="aiChoose('checkin')">
                        <i class="fas fa-location-dot mr-2 text-cyber-gold"></i> ลงเวลาเข้า-ออกงาน
                    </button>
                    <button class="ai-choice-btn" onclick="aiChoose('report')">
                        <i class="fas fa-chart-line mr-2 text-cyber-gold"></i> ดูรายงานสรุป
                    </button>
                </div>
            </div>
            <div class="ai-mascot-wrapper" id="aiMascotWrapper">
                <img src="img/avata-salute.png?v=3" class="ai-video-avatar" id="aiImage" alt="AI Assistant">
            </div>
        </div>

        <!-- LOGIN CARD (Shows after AI interaction) -->
        <div class="login-card order-2 lg:order-2" id="loginCard">
            <div class="brand-logo">
                <img src="img/logo-1.jpg"
                    onerror="this.src='https://ui-avatars.com/api/?name=N&background=0ea5e9&color=fff'" alt="NEXTGEN">
            </div>

            <h1 class="cyber-title">NEXTGEN <span style="color: var(--cyber-gold);">SYSTEM</span></h1>
            <p class="cyber-subtitle" id="formSubtitle">Identity Verification</p>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="input-wrapper">
                    <label>รหัสพนักงาน</label>
                    <input type="text" id="username" class="cyber-input" placeholder="ระบุรหัสพนักงาน" required
                        autocomplete="off">
                    <i class="fas fa-fingerprint"></i>
                </div>

                <div class="input-wrapper">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="password" class="cyber-input" placeholder="••••••••" required>
                    <i class="fas fa-shield-alt"></i>
                </div>

                <button type="submit" class="cyber-btn mt-4" id="mainSubmitBtn">
                    <span id="btnText">เข้าสู่ระบบ</span>
                    <div id="btnLoader" class="loader"></div>
                    <i class="fas fa-sign-in-alt" id="btnIcon"></i>
                </button>
            </form>

            <div id="errorMsg" class="mt-6 text-center text-rose-500 text-[11px] font-bold hidden">
                <i class="fas fa-exclamation-triangle mr-2"></i> ข้อมูลไม่ถูกต้อง โปรดลองอีกครั้ง
            </div>

            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-[9px] text-slate-500 font-bold tracking-widest uppercase">
                    &copy; 2026 NEXTGEN SYSTEM CENTER &bull; Ver.1.0
                </p>
            </div>
        </div>
    </div>


    <script>
        const SUPABASE_URL = 'https://mvcsbylbsffgbkocehzx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Y3NieWxic2ZmZ2Jrb2NlaHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjI2NzgsImV4cCI6MjA5MTg5ODY3OH0.pxuSq1TuaSetJZAabrSPqXy6RAXAwaI_VWZ9zf5TypI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const user_id = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.getElementById('mainSubmitBtn');

            // UI Feedback
            errorMsg.classList.add('hidden');
            btnText.innerText = 'กำลังตรวจสอบ...';
            btnLoader.style.display = 'block';
            btnIcon.style.display = 'none';
            mainBtn.style.pointerEvents = 'none';
            mainBtn.style.opacity = '0.7';

            try {
                // 1. ตรวจสอบข้อมูลพนักงานจาก Supabase
                const { data, error } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .eq('emp_id', user_id)
                    .eq('password', pass)
                    .single();

                if (error || !data) throw new Error('Unauthorized');

                // 2. ตรวจสอบสถานะการใช้งาน
                if (data.status === 'ปิด') {
                    alert('บัญชีนี้ถูกระงับการใช้งาน');
                    resetUI();
                    return;
                }

                // 3. ตรวจสอบ Level
                if (!data.level) {
                    alert('ไม่พบระดับการเข้าถึง โปรดติดต่อผู้ดูแลระบบ');
                    resetUI();
                    return;
                }

                // บันทึก Session
                localStorage.setItem('nextgen_user', JSON.stringify(data));

                // Success Animation
                // ตัดคำนำหน้าชื่อออกเพื่อความสวยงาม
                let cleanName = (data.name || '').trim();
                const prefixes = ['นาย', 'นางสาว', 'นาง', 'น.ส.', 'นส.'];
                prefixes.forEach(p => {
                    if (cleanName.startsWith(p)) {
                        cleanName = cleanName.replace(p, '').trim();
                    }
                });

                const fullName = `${cleanName} ${data.lastname || ''}`.trim();
                btnText.innerText = 'ยืนยันตัวตนสำเร็จ';

                // AI Welcome Message
                const aiText = document.getElementById('aiText');

                setTimeout(() => {
                    const level = (data.level || '').toLowerCase();
                    if (level === 'admin' || level === 'manager') {
                        // ระดับแอดมินหรือเมเนเจอร์ วิ่งตรงเข้า Dashboard ทันที!
                        document.getElementById('loginCard').style.display = 'none';
                        
                        typeText(aiText, `<span class="text-emerald-400 font-bold text-lg">ยืนยันตัวตนสำเร็จ!</span><br>สวัสดีครับผู้บริหารคุณ <b>${fullName}</b><br>ระบบกำลังนำคุณเข้าสู่หน้าจอ Dashboard อัตโนมัติค่ะ...`);
                        
                        setTimeout(() => {
                            window.location.href = 'Backend/dashboard.html';
                        }, 1800);
                    } else {
                        // ระดับหัวหน้างานหรือ รปภ. แสดงตัวเลือกหลังล็อกอินสำเร็จ
                        document.getElementById('loginCard').style.display = 'none';

                        typeText(aiText, `<span class="text-sky-400 font-bold text-lg">เข้าสู่ระบบสำเร็จ!</span><br>สวัสดีครับคุณ <b>${fullName}</b><br>วันนี้ต้องการเข้าใช้งานในส่วนใดดีครับ?`);
                        
                        // แสดงปุ่มทางเลือก
                        const aiChoices = document.getElementById('aiChoices');
                        aiChoices.innerHTML = `
                            <button class="ai-choice-btn" onclick="postLoginRedirect('checkin', '${level}')">
                                <i class="fas fa-location-dot mr-2 text-cyber-gold"></i> ลงเวลาเข้า-ออกงาน
                            </button>
                            <button class="ai-choice-btn" onclick="postLoginRedirect('report', '${level}')">
                                <i class="fas fa-chart-line mr-2 text-cyber-gold"></i> ${level === 'supervisor' ? 'ระบบรายงานสรุปงาน (OP)' : 'ดูประวัติสแกน/รายงาน'}
                            </button>
                        `;
                        aiChoices.style.setProperty('display', 'grid', 'important');
                        aiChoices.classList.add('animate-bounce-short');
                    }
                }, 1000);

            } catch (err) {
                console.error('Login error:', err);
                errorMsg.classList.remove('hidden');
                resetUI();
            }
        }

        function postLoginRedirect(mode, level) {
            const aiText = document.getElementById('aiText');
            const aiImage = document.getElementById('aiImage');
            const aiChoices = document.getElementById('aiChoices');
            
            aiChoices.style.setProperty('display', 'none', 'important');
            
            // เล่นเอฟเฟกต์ควันตอนสลับรูป AI เพื่อความพรีเมียม
            const newImgSrc = mode === 'checkin' ? 'img/avata-checkin.png?v=6' : 'img/avata-dashboard.png?v=6';
            aiImage.classList.add('ai-smoke-out');
            setTimeout(() => {
                aiImage.src = newImgSrc;
                aiImage.classList.remove('ai-smoke-out');
                aiImage.classList.add('ai-smoke-in');
                setTimeout(() => { aiImage.classList.remove('ai-smoke-in'); }, 500);
            }, 450);

            if (mode === 'checkin') {
                typeText(aiText, "รับทราบครับ! กำลังเปิดหน้าจอ <b>ลงเวลาเข้า-ออกหน่วยงาน</b>...");
                setTimeout(() => {
                    window.location.href = 'checkin.html';
                }, 1200);
            } else {
                typeText(aiText, "รับทราบครับ! กำลังเปิดหน้าจอ <b>ระบบสรุปและรายงานปฏิบัติงาน</b>...");
                setTimeout(() => {
                    window.location.href = level === 'supervisor' ? 'Frontend/staff.html' : 'Frontend/guard.html';
                }, 1200);
            }
        }

        function resetUI() {
            document.getElementById('loginCard').style.display = 'block';
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.getElementById('mainSubmitBtn');

            btnText.innerText = 'เข้าสู่ระบบ';
            btnIcon.className = 'fas fa-sign-in-alt';
            btnLoader.style.display = 'none';
            btnIcon.style.display = 'block';
            mainBtn.style.pointerEvents = 'auto';
            mainBtn.style.opacity = '1';
        }

        window.onload = () => {
            // เคลียร์ session เก่าเพื่อบังคับให้ล็อกอินใหม่ทุกครั้งตามความต้องการ
            localStorage.removeItem('nextgen_user');
            console.log("System Ready. Please login.");

            // AI Greeting Logic
            setTimeout(initAIGreeting, 1000);
        }

        // --- SMART TYPEWRITER EFFECT ---
        function typeText(element, html, speed = 20) {
            element.innerHTML = "";
            let i = 0;
            let isTag = false;
            let currentHtml = "";

            function type() {
                if (i < html.length) {
                    let char = html.charAt(i);
                    if (char === "<") isTag = true;

                    currentHtml += char;

                    if (char === ">") {
                        isTag = false;
                        element.innerHTML = currentHtml + '<span class="ai-cursor"></span>';
                    }

                    if (!isTag) {
                        element.innerHTML = currentHtml + '<span class="ai-cursor"></span>';
                        i++;
                        setTimeout(type, speed);
                    } else {
                        i++;
                        type();
                    }
                } else {
                    element.innerHTML = html + '<span class="ai-cursor"></span>';
                }
            }
            type();
        }

        function initAIGreeting() {
            const aiText = document.getElementById('aiText');
            const aiImage = document.getElementById('aiImage');

            // ท่าตะเบ๊ะเริ่มต้น
            aiImage.src = 'img/avata-salute.png?v=3';
            typeText(aiText, `<h2 class="text-3xl font-black text-amber-400 mb-2 tracking-tight animate-pulse">สวัสดีครับ</h2><p class="text-base opacity-80">ผม <b>Nextgen-AI</b> ยินดีที่ได้ดูแลคุณครับ<br>กรุณากรอกรหัสพนักงานและรหัสผ่านเพื่อเข้าสู่ระบบงานได้เลยครับ</p>`);
        }

        function toggleAI() {
            const bubble = document.getElementById('aiBubble');
            bubble.classList.toggle('hidden');
        }
    </script>
