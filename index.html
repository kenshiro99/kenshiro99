<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexgen Portal | AI Assistant</title>

    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyber-blue: #0ea5e9;
            --cyber-gold: #f59e0b;
            --cyber-dark: #020617;
            --glass: rgba(15, 23, 42, 0.85);
        }

        body {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
            transition: background 1s ease;
        }

        /* --- BACKGROUND --- */
        .mesh-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        .orb-1 { width: 400px; height: 400px; background: rgba(14, 165, 233, 0.1); top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(245, 158, 11, 0.05); bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 100px); }
        }

        .mesh-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
        }

        /* --- AI ASSISTANT LAYOUT --- */
        #mainGateway {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            transition: all 0.8s ease-in-out;
        }

        .ai-assistant-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ai-mascot-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float-ai 5s ease-in-out infinite;
            order: 2;
        }

        .ai-video-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .ai-bubble {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(14, 165, 233, 0.1);
            text-align: center;
            order: 1;
            animation: bubble-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), bubble-glow 4s infinite;
        }

        .ai-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid rgba(30, 41, 59, 0.9);
        }

        /* --- GATEWAY ACTIVE (Desktop) --- */
        #mainGateway.gateway-active {
            flex-direction: row-reverse !important;
            gap: 60px;
        }

        #mainGateway.gateway-active .ai-assistant-container {
            width: 350px;
            margin-top: 100px; /* เลื่อนลงมาให้ตรงโลโก้ */
        }

        #mainGateway.gateway-active .ai-mascot-wrapper {
            width: 160px;
            height: 160px;
        }

        #mainGateway.gateway-active .ai-bubble {
            padding: 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* --- LOGIN CARD --- */
        .login-card {
            display: none;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            animation: cardEntrance 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .gateway-active .login-card {
            display: block;
        }

        .card-header {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .brand-logo img {
            height: 85px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.3);
        }

        .cyber-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cyber-subtitle {
            text-align: center;
            color: var(--cyber-blue);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        /* --- INPUTS & BUTTONS --- */
        .input-wrapper {
            position: relative;
            margin-bottom: 22px;
        }

        .input-wrapper label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            color: var(--cyber-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        .cyber-input {
            width: 100%;
            background: rgba(2, 6, 23, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 16px 20px 16px 50px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .cyber-input:focus {
            outline: none;
            border-color: var(--cyber-blue);
            background: rgba(14, 165, 233, 0.05);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            top: 40px;
            color: #475569;
            transition: 0.3s;
        }

        .cyber-input:focus + i {
            color: var(--cyber-blue);
        }

        .cyber-btn {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
            transition: all 0.3s;
            margin-top: 20px;
        }

        .cyber-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.5);
        }

        .ai-choice-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 15px;
            color: #bae6fd;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            transition: 0.3s;
        }

        .ai-choice-btn:hover {
            background: rgba(14, 165, 233, 0.25);
            transform: translateX(5px);
        }

        /* --- ANIMATIONS --- */
        @keyframes float-ai {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes bubble-pop {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes bubble-glow {
            0%, 100% { border-color: rgba(14, 165, 233, 0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 20px rgba(14,165,233,0.1); }
            50% { border-color: rgba(14, 165, 233, 0.6); box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 35px rgba(14,165,233,0.3); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .ai-smoke-out { animation: smoke-dissolve 0.5s ease-in forwards; }
        .ai-smoke-in { animation: smoke-materialize 0.5s ease-out forwards; }
        @keyframes smoke-dissolve {
            0% { opacity: 1; filter: blur(0); transform: scale(1); }
            100% { opacity: 0; filter: blur(30px); transform: scale(1.3); }
        }
        @keyframes smoke-materialize {
            0% { opacity: 0; filter: blur(30px); transform: scale(0.8); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        .ai-cursor {
            display: inline-block;
            width: 8px; height: 18px; background: var(--cyber-gold);
            margin-left: 5px; vertical-align: middle;
            animation: blink 0.8s infinite; box-shadow: 0 0 10px var(--cyber-gold);
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- MOBILE --- */
        @media (max-width: 992px) {
            #mainGateway.gateway-active { flex-direction: column !important; gap: 20px; }
            #mainGateway.gateway-active .ai-assistant-container { width: 100%; margin-top: 20px; }
            .login-card { width: 95%; padding: 35px 25px; }
        }
    </style>
</head>

<body>
    <div class="mesh-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="mainGateway">
        <!-- AI ASSISTANT -->
        <div class="ai-assistant-container" id="aiAssistant">
            <div class="ai-bubble" id="aiBubble">
                <div id="aiText">กำลังเชื่อมต่อ...</div>
                <div id="aiChoices" class="grid grid-cols-1 sm:grid-cols-2 gap-3" style="display:none;">
                    <button class="ai-choice-btn" onclick="aiChoose('checkin')">
                        <i class="fas fa-location-dot mr-2"></i> ลงเวลางาน
                    </button>
                    <button class="ai-choice-btn" onclick="aiChoose('report')">
                        <i class="fas fa-chart-line mr-2"></i> ดูรายงาน
                    </button>
                </div>
            </div>
            <div class="ai-mascot-wrapper" id="aiMascotWrapper">
                <img src="img/avata-salute.png?v=3" class="ai-video-avatar" id="aiImage" alt="AI">
            </div>
        </div>

        <!-- LOGIN CARD -->
        <div class="login-card" id="loginCard">
            <div class="card-header">
                <div class="brand-logo">
                    <img src="img/logo-1.jpg" onerror="this.src='https://ui-avatars.com/api/?name=NEXGEN&background=0ea5e9&color=fff'" alt="Logo">
                </div>
            </div>
            <h1 class="cyber-title">NEXGEN <span style="color:var(--cyber-gold)">SYSTEM</span></h1>
            <p class="cyber-subtitle" id="formSubtitle">Identity Verification</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-wrapper">
                    <label>รหัสพนักงาน</label>
                    <input type="text" id="username" class="cyber-input" placeholder="ระบุรหัสพนักงาน" required>
                    <i class="fas fa-fingerprint"></i>
                </div>
                <div class="input-wrapper">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="password" class="cyber-input" placeholder="••••••••" required>
                    <i class="fas fa-shield-alt"></i>
                </div>

                <div class="hidden">
                    <input type="radio" name="login_mode" id="mode_checkin" value="checkin">
                    <input type="radio" name="login_mode" id="mode_report" value="report">
                </div>

                <button type="submit" class="cyber-btn">
                    <span id="btnText">ยืนยันตัวตน</span>
                    <i class="fas fa-satellite-dish ml-2"></i>
                </button>
            </form>

            <div id="errorMsg" class="mt-6 text-center text-rose-500 text-[11px] font-bold hidden animate-pulse">
                <i class="fas fa-exclamation-triangle mr-2"></i> ข้อมูลไม่ถูกต้อง โปรดลองอีกครั้ง
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mvcsbylbsffgbkocehzx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Y3NieWxic2ZmZ2Jrb2NlaHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjI2NzgsImV4cCI6MjA5MTg5ODY3OH0.pxuSq1TuaSetJZAabrSPqXy6RAXAwaI_VWZ9zf5TypI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = () => {
            localStorage.removeItem('nexgen_user');
            setTimeout(initAIGreeting, 1000);
        };

        function typeText(element, html, speed = 25) {
            element.innerHTML = "";
            let i = 0, isTag = false, currentHtml = "";
            function type() {
                if (i < html.length) {
                    let char = html.charAt(i);
                    if (char === "<") isTag = true;
                    currentHtml += char;
                    if (char === ">") { isTag = false; element.innerHTML = currentHtml + '<span class="ai-cursor"></span>'; }
                    if (!isTag) { element.innerHTML = currentHtml + '<span class="ai-cursor"></span>'; i++; setTimeout(type, speed); }
                    else { i++; type(); }
                } else { element.innerHTML = html + '<span class="ai-cursor"></span>'; }
            }
            type();
        }

        function initAIGreeting() {
            const aiText = document.getElementById('aiText');
            const aiChoices = document.getElementById('aiChoices');
            typeText(aiText, `<h2 class="text-3xl font-black text-amber-400 mb-2">สวัสดีค่ะ</h2><p>ดิฉัน <b>Nexgen-AI</b> ยินดีที่ได้ดูแลคุณค่ะ</p>`);
            setTimeout(() => {
                typeText(aiText, `<p>วันนี้ต้องการให้ดิฉันช่วยดำเนินการส่วนไหนดีคะ?</p>`);
                aiChoices.style.display = 'grid';
            }, 3000);
        }

        function aiChoose(mode) {
            const aiImage = document.getElementById('aiImage');
            const aiText = document.getElementById('aiText');
            const newImg = mode === 'checkin' ? 'img/avata-checkin.png?v=7' : 'img/avata-dashboard.png?v=7';
            
            document.getElementById('aiChoices').style.display = 'none';
            aiImage.classList.add('ai-smoke-out');
            
            setTimeout(() => {
                aiImage.src = newImg;
                aiImage.classList.remove('ai-smoke-out');
                aiImage.classList.add('ai-smoke-in');
                setTimeout(() => aiImage.classList.remove('ai-smoke-in'), 500);
            }, 450);

            if (mode === 'checkin') {
                document.getElementById('mode_checkin').checked = true;
                typeText(aiText, "รับทราบค่ะ! กำลังเปิดระบบ <b>ลงเวลางาน</b> กรุณาระบุรหัสพนักงานนะคะ");
                document.body.style.background = "radial-gradient(circle at center, #0c4a6e 0%, #020617 100%)";
            } else {
                document.getElementById('mode_report').checked = true;
                typeText(aiText, "รับทราบค่ะ! กำลังเปิดระบบ <b>รายงานสรุป</b> กรุณาระบุรหัสพนักงานนะคะ");
                document.body.style.background = "radial-gradient(circle at center, #1e1b4b 0%, #020617 100%)";
            }
            document.getElementById('mainGateway').classList.add('gateway-active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user_id = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const mode = document.querySelector('input[name="login_mode"]:checked').value;
            
            const btnText = document.getElementById('btnText');
            const mainBtn = e.target.querySelector('button[type="submit"]');

            // UI Feedback
            errorMsg.classList.add('hidden');
            btnText.innerText = 'กำลังตรวจสอบ...';
            mainBtn.style.pointerEvents = 'none';
            mainBtn.style.opacity = '0.7';

            try {
                const { data, error } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .eq('emp_id', user_id)
                    .eq('password', pass)
                    .single();

                if (error || !data) throw new Error('Unauthorized');

                if (data.status === 'ปิด') {
                    alert('บัญชีนี้ถูกระงับการใช้งาน');
                    resetUI();
                    return;
                }

                localStorage.setItem('nexgen_user', JSON.stringify(data));

                let cleanName = (data.name || '').trim();
                const prefixes = ['นาย', 'นางสาว', 'นาง', 'น.ส.', 'นส.'];
                prefixes.forEach(p => { if (cleanName.startsWith(p)) cleanName = cleanName.replace(p, '').trim(); });
                const fullName = `${cleanName} ${data.lastname || ''}`.trim();
                
                btnText.innerText = 'ยืนยันตัวตนสำเร็จ';

                const aiText = document.getElementById('aiText');
                document.getElementById('aiChoices').style.display = 'none';
                document.getElementById('loginCard').style.opacity = '0.3';
                
                aiText.innerHTML = `<span class="text-amber-400 font-bold text-lg">ยินดีต้อนรับค่ะคุณ ${fullName}!</span><br>กำลังพาคุณเข้าสู่ระบบนะคะ...`;

                setTimeout(() => {
                    const level = (data.level || '').toLowerCase();
                    if (level === 'admin' || level === 'manager') {
                        window.location.href = 'Backend/dashboard.html';
                    } else {
                        if (mode === 'checkin') {
                            window.location.href = 'checkin.html';
                        } else {
                            window.location.href = level === 'supervisor' ? 'Frontend/staff.html' : 'Frontend/guard.html';
                        }
                    }
                }, 2000);

            } catch (err) {
                console.error('Login error:', err);
                errorMsg.classList.remove('hidden');
                resetUI();
            }
        }

        function resetUI() {
            const btnText = document.getElementById('btnText');
            const mainBtn = document.querySelector('.cyber-btn');
            btnText.innerText = 'ยืนยันตัวตน';
            mainBtn.style.pointerEvents = 'auto';
            mainBtn.style.opacity = '1';
        }
    </script>
</body>
</html>
