<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexgen ระบบพอร์ทัล | เข้าสู่ระบบ</title>

    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cyber-blue: #0ea5e9;
            --cyber-gold: #f59e0b;
            --cyber-dark: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --bg-gradient: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        body {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            background: var(--bg-gradient);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            position: relative;
            transition: background 1s ease; /* เพื่อความนุ่มนวลเวลาเปลี่ยนสี */
        }

        /* --- BACKGROUND ANIMATIONS --- */
        .mesh-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 1) 100%);
        }

        .mesh-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(14, 165, 233, 0.1);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(245, 158, 11, 0.05);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(100px, 100px);
            }
        }

        /* --- LOGIN CARD DESIGN --- */
        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            width: 90%;
            max-width: 420px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(14, 165, 233, 0.05);
            position: relative;
            overflow: hidden;
            display: none;
            /* ซ่อนไว้ก่อนจนกว่าจะเลือกโหมด */
            animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #mainGateway {
            transition: all 0.8s ease-in-out;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .ai-assistant-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.8s ease-in-out;
            width: 100%;
            z-index: 100;
        }

        .gateway-active .login-card {
            display: block;
        }

        .gateway-active .ai-assistant-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 420px;
            display: flex;
            flex-direction: column; /* เปลี่ยนเป็นแนวตั้งเพื่อให้ bubble อยู่ติดกับ AI */
            align-items: flex-end; /* ดันไปทางขวา */
            gap: 5px; /* ลดช่องว่างให้น้อยที่สุด */
            pointer-events: none;
            z-index: 1000;
        }

        .gateway-active .ai-bubble {
            position: relative;
            top: 0;
            left: 0;
            right: 0;
            width: auto;
            max-width: 80%;
            border-radius: 15px;
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.95);
            border-left: 3px solid var(--cyber-blue);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            font-size: 13px;
            pointer-events: auto;
        }

        .gateway-active .ai-mascot-wrapper {
            width: 25vw !important; /* ปรับขนาดตามหน้าจอ */
            height: 25vw !important;
            max-width: 100px;
            max-height: 100px;
            pointer-events: auto;
        }

        /* Responsive Fixes for Mobile */
        @media (max-width: 480px) {
            .gateway-active .ai-assistant-container {
                top: 2%;
            }
            .gateway-active .ai-mascot-wrapper {
                width: 30vw !important;
                height: 30vw !important;
            }
            .gateway-active .ai-bubble {
                font-size: 11px;
                padding: 8px 12px;
            }
        }

        /* Responsive Fixes for Mobile */
        @media (max-width: 768px) {
            .ai-mascot-wrapper {
                width: 180px !important;
                height: 180px !important;
            }
            .gateway-active .ai-assistant-container {
                position: absolute;
                top: 25px;
                left: 50%;
                transform: translateX(-50%);
                max-width: 95%;
                padding: 0 15px;
                flex-direction: row;
                justify-content: flex-end;
            }
            .gateway-active .ai-mascot-wrapper {
                width: 80px !important;
                height: 80px !important;
            }
            .ai-bubble {
                width: 95%;
                padding: 15px;
            }
            .gateway-active .ai-bubble {
                position: absolute;
                top: 75px;
                left: 15px;
                right: 15px;
                width: auto;
                font-size: 12px;
            }
            .login-card {
                padding: 30px 20px;
                border-radius: 30px;
                width: 95%;
                margin-top: 20px;
            }
        }

        #aiChoices {
            display: none;
            /* ซ่อนจนกว่าจะทักทายเสร็จ */
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* --- LOGO & TYPOGRAPHY --- */
        .brand-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            border-radius: 30px;
            border: 2px solid rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
            animation: pulse-border 4s ease-in-out infinite;
            overflow: hidden;
        }

        @keyframes pulse-border {

            0%,
            100% {
                border-color: rgba(14, 165, 233, 0.4);
                box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
            }

            50% {
                border-color: rgba(245, 158, 11, 0.6);
                box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            }
        }

        .brand-logo::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-20deg);
            animation: sheen 3s infinite;
        }

        @keyframes sheen {
            0% {
                left: -150%;
            }

            100% {
                left: 150%;
            }
        }

        .ai-video-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: circle(48%);
            mix-blend-mode: screen; 
            /* เร่ง Contrast สุดตัวเพื่อให้สีที่ไม่ดำสนิทกลายเป็นดำสนิท 100% */
            filter: contrast(2.5) brightness(1.1);
            border: none;
            background: transparent !important;
        }

        .brand-logo img {
            width: 90%;
            height: 90%;
            border-radius: 22px;
            object-fit: cover;
            filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.2));
        }

        .cyber-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #fff 40%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cyber-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: var(--cyber-blue);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* --- INPUT FIELDS --- */
        .input-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .input-wrapper label {
            position: absolute;
            left: 20px;
            top: -10px;
            background: #0f172a;
            padding: 0 8px;
            font-size: 10px;
            font-weight: 800;
            color: var(--cyber-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            border-radius: 4px;
        }

        .cyber-input {
            width: 100%;
            padding: 18px 24px 18px 55px;
            background: rgba(2, 6, 23, 0.4) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 18px;
            color: white !important;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .cyber-input:focus {
            border-color: var(--cyber-blue) !important;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.15);
            background: rgba(2, 6, 23, 0.6) !important;
        }

        .input-wrapper i {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            transition: 0.3s;
        }

        .cyber-input:focus+i {
            color: var(--cyber-blue);
            transform: translateY(-50%) scale(1.2);
        }

        .cyber-btn {
            width: 100%;
            padding: 20px;
            background: var(--btn-bg, linear-gradient(135deg, #10b981 0%, #059669 100%));
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--btn-shadow, 0 10px 25px rgba(16, 185, 129, 0.3));
        }

        .cyber-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--btn-shadow-hover, 0 15px 35px rgba(16, 185, 129, 0.4));
            filter: brightness(1.1);
        }

        .cyber-btn.mode-report {
            --btn-bg: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            --btn-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
            --btn-shadow-hover: 0 15px 35px rgba(14, 165, 233, 0.4);
        }

        /* --- MODE SELECTOR --- */
        .mode-selector {
            display: flex;
            position: relative;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 25px;
            padding: 6px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .mode-selector input[type="radio"] {
            display: none;
        }

        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 14px 5px;
            font-size: 12px;
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-selector input[id="mode_checkin"]:checked~.mode-slider {
            transform: translateX(0);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.3) 100%);
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .mode-selector input[id="mode_report"]:checked~.mode-slider {
            transform: translateX(100%);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(2, 132, 199, 0.3) 100%);
            border-color: rgba(14, 165, 233, 0.5);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
        }

        .mode-selector input[id="mode_checkin"]:checked+label {
            color: #34d399;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        .mode-selector input[id="mode_report"]:checked+label {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(14, 165, 233, 0.6);
        }

        .mode-slider {
            position: absolute;
            top: 6px;
            left: 6px;
            width: calc(50% - 6px);
            height: calc(100% - 12px);
            border-radius: 12px;
            border: 1px solid transparent;
            z-index: 1;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(10px);
        }

        .cyber-btn-outline {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(14, 165, 233, 0.3);
            border-radius: 20px;
            color: #bae6fd;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .cyber-btn-outline:hover {
            background: rgba(14, 165, 233, 0.15);
            border-color: var(--cyber-blue);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.15);
        }

        .loader {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s infinite linear;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-text {
            margin-top: 35px;
            text-align: center;
            font-size: 11px;
            color: #475569;
            font-weight: 600;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 25px;
            }

            .cyber-title {
                font-size: 24px;
            }
        }

        /* --- AI ASSISTANT STYLES --- */
        .ai-assistant-container {
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ai-mascot-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            cursor: pointer;
            transition: all 0.8s ease-in-out;
            animation: float-ai 5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ตัดขอบสี่เหลี่ยมทิ้งถาวรด้วยวงกลม */
            clip-path: circle(48%);
            -webkit-clip-path: circle(48%);
        }

        .gateway-active .ai-mascot-wrapper {
            width: 140px;
            height: 140px;
            mask-image: none; /* เอา Mask ออกเมื่อย่อขนาดเพื่อความชัดเจน */
            -webkit-mask-image: none;
        }

        .ai-mascot-wrapper:hover {
            transform: scale(1.05);
        }

        /* --- HD Hologram: Focus on Clarity --- */
        .ai-video-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: screen;
            /* ทำให้พื้นหลังสีดำสนิทหายไปและเนียนไปกับสีแอป */
            filter: brightness(1.05) contrast(1.1);
            /* ปรับให้คมชัดขึ้นเล็กน้อย */
            border: none;
            background: none;
        }

        /* --- Ambient Glow Removed --- */

        @keyframes float-ai {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* --- FUTURISTIC TRANSITION EFFECTS --- */
        .ai-glitch {
            animation: glitch-anim 0.3s ease-in-out;
        }

        @keyframes glitch-anim {
            0% {
                transform: translate(0);
                filter: hue-rotate(0deg) brightness(1);
            }

            20% {
                transform: translate(-5px, 2px);
                filter: hue-rotate(90deg) brightness(2);
            }

            40% {
                transform: translate(5px, -2px);
                filter: hue-rotate(180deg) brightness(1.5);
            }

            60% {
                transform: translate(-3px, -1px);
                filter: hue-rotate(270deg) brightness(2);
            }

            80% {
                transform: translate(3px, 1px);
                filter: hue-rotate(360deg) brightness(1.2);
            }

            100% {
                transform: translate(0);
                filter: hue-rotate(0deg) brightness(1);
            }
        }

        .ai-flash {
            position: relative;
        }

        .ai-flash::before {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            border-radius: 50%;
            z-index: 10;
            animation: flash-anim 0.4s ease-out forwards;
            pointer-events: none;
        }

        @keyframes flash-anim {
            0% {
                opacity: 0.8;
                transform: scale(0.5);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        .ai-bubble {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.4);
            border-radius: 30px 30px 5px 30px;
            padding: 25px;
            width: 320px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            transform-origin: bottom right;
            animation: bubble-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 5px;
        }

        @keyframes bubble-pop {
            from {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .ai-text {
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 15px;
        }

        .ai-choice-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 12px;
            color: #bae6fd;
            font-size: 11px;
            font-weight: 700;
            text-align: left;
            transition: all 0.3s;
        }

        .ai-choice-btn:hover {
            background: rgba(14, 165, 233, 0.3);
            border-color: var(--cyber-blue);
            color: white;
            transform: translateX(5px);
        }

        .ai-choice-btn i {
            margin-right: 8px;
            color: var(--cyber-gold);
        }

        @media (max-width: 768px) {
            .ai-assistant-container {
                right: 20px;
                bottom: 20px;
            }

            .ai-bubble {
                width: 220px;
                padding: 15px;
            }

            .ai-mascot {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

    <div class="mesh-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="flex flex-col items-center justify-center w-full max-w-4xl px-4" id="mainGateway">

        <!-- AI ASSISTANT (CONCIERGE MODE) -->
        <div class="ai-assistant-container" id="aiAssistant">
            <div class="ai-bubble" id="aiBubble">
                <div class="ai-text" id="aiText">
                    กำลังเตรียมระบบผู้ช่วย...
                </div>
                <div id="aiChoices" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button class="ai-choice-btn py-4" onclick="aiChoose('checkin')">
                        <i class="fas fa-location-dot"></i> ลงเวลางาน
                    </button>
                    <button class="ai-choice-btn py-4" onclick="aiChoose('report')">
                        <i class="fas fa-chart-line"></i> ดูรายงานสรุป
                    </button>
                </div>
            </div>
            <div class="ai-mascot-wrapper" id="aiMascotWrapper">
                <img src="img/avata2.png" class="ai-video-avatar" id="aiImage" alt="AI Assistant">
            </div>
        </div>

        <div class="login-card" id="loginCard">
            <div class="card-header">
                <div class="brand-logo m-0">
                    <img src="img/logo-1.jpg"
                        onerror="this.src='https://ui-avatars.com/api/?name=NEXGEN&background=0ea5e9&color=fff'" alt="NEXGEN">
                </div>
            </div>

            <h1 class="cyber-title">NEXGEN <span style="color: var(--cyber-gold);">SYSTEM CENTER</span></h1>
            <p class="cyber-subtitle" id="formSubtitle">Identity Verification</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-wrapper">
                    <label>รหัสพนักงาน</label>
                    <input type="text" id="username" class="cyber-input" placeholder="ระบุรหัสพนักงาน" required
                        autocomplete="off">
                    <i class="fas fa-fingerprint"></i>
                </div>

                <div class="input-wrapper">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="password" class="cyber-input" placeholder="••••••••" required>
                    <i class="fas fa-shield-alt"></i>
                </div>

                <!-- HIDDEN MODE SELECTOR (NOW CONTROLLED BY AI) -->
                <div class="hidden">
                    <input type="radio" name="login_mode" id="mode_checkin" value="checkin">
                    <input type="radio" name="login_mode" id="mode_report" value="report">
                </div>

                <button type="submit" class="cyber-btn" id="mainSubmitBtn">
                    <span id="btnText">ยืนยันตัวตน</span>
                    <div id="btnLoader" class="loader"></div>
                    <i class="fas fa-satellite-dish" id="btnIcon"></i>
                </button>
            </form>

            <div id="errorMsg" class="mt-6 text-center text-rose-500 text-[11px] font-bold hidden animate-pulse">
                <i class="fas fa-exclamation-triangle mr-2"></i> ข้อมูลไม่ถูกต้อง โปรดลองอีกครั้ง
            </div>

            <div class="footer-text mt-8 pt-6 border-t border-white/5 space-y-2 text-center">
                <p class="text-[9px] text-slate-500 font-bold tracking-[1px] opacity-60">
                    <span class="uppercase">&copy; 2026 &bull; NEXGEN SYSTEM CENTER</span> <span
                        class="ml-1">Ver.1.0</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mvcsbylbsffgbkocehzx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Y3NieWxic2ZmZ2Jrb2NlaHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjI2NzgsImV4cCI6MjA5MTg5ODY3OH0.pxuSq1TuaSetJZAabrSPqXy6RAXAwaI_VWZ9zf5TypI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Dynamic UI Switch based on Mode
        document.addEventListener('DOMContentLoaded', () => {
            const radios = document.querySelectorAll('input[name="login_mode"]');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const mainBtn = document.getElementById('mainSubmitBtn');

            radios.forEach(radio => {
                radio.addEventListener('change', function () {
                    if (this.value === 'checkin') {
                        btnText.innerText = 'เริ่มสแกนพิกัด';
                        btnIcon.className = 'fas fa-satellite-dish';
                        mainBtn.classList.remove('mode-report');
                    } else {
                        btnText.innerText = 'เข้าสู่แดชบอร์ด';
                        btnIcon.className = 'fas fa-bolt';
                        mainBtn.classList.add('mode-report');
                    }
                });
            });
        });

        async function handleLogin(e) {
            e.preventDefault();
            const user_id = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const mode = document.querySelector('input[name="login_mode"]:checked').value;
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.getElementById('mainSubmitBtn');

            // UI Feedback
            errorMsg.classList.add('hidden');
            btnText.innerText = 'กำลังตรวจสอบ...';
            btnLoader.style.display = 'block';
            btnIcon.style.display = 'none';
            mainBtn.style.pointerEvents = 'none';
            mainBtn.style.opacity = '0.7';

            try {
                // 1. ตรวจสอบข้อมูลพนักงานจาก Supabase
                const { data, error } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .eq('emp_id', user_id)
                    .eq('password', pass)
                    .single();

                if (error || !data) throw new Error('Unauthorized');

                // 2. ตรวจสอบสถานะการใช้งาน
                if (data.status === 'ปิด') {
                    alert('บัญชีนี้ถูกระงับการใช้งาน');
                    resetUI();
                    return;
                }

                // 3. ตรวจสอบ Level (ตามความต้องการของผู้ใช้)
                if (!data.level) {
                    alert('ไม่พบระดับการเข้าถึง โปรดติดต่อผู้ดูแลระบบ');
                    resetUI();
                    return;
                }

                // บันทึก Session
                localStorage.setItem('nexgen_user', JSON.stringify(data));

                // Success Animation
                // ตัดคำนำหน้าชื่อออกเพื่อความสวยงาม
                let cleanName = (data.name || '').trim();
                const prefixes = ['นาย', 'นางสาว', 'นาง', 'น.ส.', 'นส.'];
                prefixes.forEach(p => {
                    if (cleanName.startsWith(p)) {
                        cleanName = cleanName.replace(p, '').trim();
                    }
                });

                const fullName = `${cleanName} ${data.lastname || ''}`.trim();
                btnText.innerText = 'ยืนยันตัวตนสำเร็จ';

                // AI Welcome Message
                const aiText = document.getElementById('aiText');
                document.getElementById('aiChoices').style.display = 'none';
                document.getElementById('loginCard').style.opacity = '0.3';
                document.getElementById('loginCard').style.pointerEvents = 'none';

                aiText.innerHTML = `<span class="text-amber-400 font-bold text-lg">ยินดีต้อนรับค่ะคุณ ${fullName}!</span><br>ดิฉันตรวจสอบข้อมูลเรียบร้อยแล้ว กำลังพาคุณเข้าสู่ระบบนะคะ...`;

                setTimeout(() => {
                    const level = (data.level || '').toLowerCase();
                    if (level === 'admin' || level === 'manager') {
                        window.location.href = 'Backend/dashboard.html';
                    } else {
                        // แยกการเดินทางตามปุ่มที่เลือก
                        if (mode === 'checkin') {
                            window.location.href = 'checkin.html';
                        } else {
                            window.location.href = level === 'supervisor' ? 'Frontend/staff.html' : 'Frontend/guard.html';
                        }
                    }
                }, 2000);

            } catch (err) {
                console.error('Login error:', err);
                errorMsg.classList.remove('hidden');
                resetUI();
            }
        }

        function resetUI() {
            const mode = document.querySelector('input[name="login_mode"]:checked').value;
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.getElementById('mainSubmitBtn');

            if (mode === 'checkin') {
                btnText.innerText = 'เริ่มสแกนพิกัด';
                btnIcon.className = 'fas fa-satellite-dish';
            } else {
                btnText.innerText = 'เข้าสู่แดชบอร์ด';
                btnIcon.className = 'fas fa-bolt';
            }

            btnLoader.style.display = 'none';
            btnIcon.style.display = 'block';
            mainBtn.style.pointerEvents = 'auto';
            mainBtn.style.opacity = '1';
        }

        window.onload = () => {
            // เคลียร์ session เก่าเพื่อบังคับให้ล็อกอินใหม่ทุกครั้งตามความต้องการ
            localStorage.removeItem('nexgen_user');
            console.log("System Ready. Please login.");

            // AI Greeting Logic
            setTimeout(initAIGreeting, 1500);
        }

        function initAIGreeting() {
            const aiText = document.getElementById('aiText');
            const aiImage = document.getElementById('aiImage');
            const aiChoices = document.getElementById('aiChoices');
            const aiMascotWrapper = document.getElementById('aiMascotWrapper');

            // 1. ท่าตะเบ๊ะ + สวัสดีค่ะ
            aiImage.src = 'img/avata-salute.png';
            aiText.innerHTML = `<h2 class="text-4xl font-black text-amber-400 mb-4 tracking-tight animate-pulse">สวัสดีค่ะ</h2><p class="text-lg opacity-80">ดิฉัน <b>Nexgen-AI</b> ยินดีที่ได้ดูแลคุณค่ะ</p>`;

            // 2. ดีเลย์ 2.8 วินาที แล้วเปลี่ยนท่าแบบล้ำๆ
            setTimeout(() => {
                // Trigger Futuristic Transition
                aiMascotWrapper.classList.add('ai-flash', 'ai-glitch');

                setTimeout(() => {
                    aiImage.src = 'img/avata2.png';
                    aiText.innerHTML = `<p class="text-base">วันนี้ต้องการให้ดิฉันช่วยดำเนินการในส่วนไหนดีคะ?</p>`;
                    aiChoices.style.display = 'grid';
                    aiChoices.classList.add('animate-bounce-short');

                    // Remove effects after finished
                    setTimeout(() => {
                        aiMascotWrapper.classList.remove('ai-flash', 'ai-glitch');
                    }, 500);
                }, 150);
            }, 2800);
        }

        function aiChoose(mode) {
            const checkinRadio = document.getElementById('mode_checkin');
            const reportRadio = document.getElementById('mode_report');
            const mainGateway = document.getElementById('mainGateway');
            const aiText = document.getElementById('aiText');
            const formSubtitle = document.getElementById('formSubtitle');
            const aiChoices = document.getElementById('aiChoices');

            // ซ่อนเมนูทันทีที่เลือก
            aiChoices.style.display = 'none';

            // Set Mode & Change Theme
            if (mode === 'checkin') {
                checkinRadio.checked = true;
                aiText.innerHTML = "รับทราบค่ะ! กำลังเปิดระบบ <b>ลงเวลาเข้า-ออกหน่วยงาน</b> กรุณากรอกรหัสพนักงานและรหัสผ่านเพื่อเข้า-ออกหน่วยงานนะคะ";
                formSubtitle.innerText = "Portal: Clock-In System";
                
                // เปลี่ยนโทนแอปเป็นสีฟ้าสดใส
                document.body.style.background = "radial-gradient(circle at center, #0c4a6e 0%, #020617 100%)";
            } else {
                reportRadio.checked = true;
                aiText.innerHTML = "รับทราบค่ะ! กำลังเข้าสู่ระบบ <b>รายงานสรุป</b> กรุณากรอกรหัสพนักงานและรหัสผ่านเพื่อเข้าระบบรายงานสรุปนะคะ";
                formSubtitle.innerText = "Admin: Reporting System";
                
                // เปลี่ยนโทนแอปเป็นสีน้ำเงินเข้มหรูหรา
                document.body.style.background = "radial-gradient(circle at center, #1e1b4b 0%, #020617 100%)";
            }

            // Switch UI to Login Mode
            mainGateway.classList.add('gateway-active');

            // Focus Input
            setTimeout(() => {
                document.getElementById('username').focus();
            }, 800);
        }

        function toggleAI() {
            const bubble = document.getElementById('aiBubble');
            bubble.classList.toggle('hidden');
        }
    </script>
</body>

</html>
