<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการรายงาน OP07 | NEXTGEN System Center</title>
    
    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <script src="js/sidebar.js"></script>

    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        :root { --primary: #818cf8; }
        body { font-family: 'Sarabun', sans-serif; background: #020617; color: white; margin: 0; overflow: hidden; }
        .main-content { flex: 1; padding: 16px; background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 600px); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; }
        
        .clock-widget { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 8px 16px; border-radius: 16px; text-align: right; min-width: 180px; }
        #digital-clock { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; color: #818cf8; line-height: 1; margin-bottom: 4px; }
        #digital-date { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #64748b; }

        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-pass { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-issue { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); }
        .status-warn { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }

        .submenu.open { display: block; }
    </style>
</head>

<body>
    <div class="flex h-screen w-screen overflow-hidden">
        <aside id="sidebar-container" class="sidebar flex flex-col shrink-0"></aside>

        <main class="main-content flex flex-col h-full overflow-hidden pb-10">
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 flex-none">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-indigo-600/20 flex items-center justify-center border border-indigo-600/30 text-indigo-400">
                        <i class="fas fa-graduation-cap text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black tracking-tighter uppercase leading-none mb-1">
                            Monthly <span class="text-indigo-400">Training (OP07)</span>
                        </h1>
                        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[3px]">รายงานการอบรมประจำเดือน</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="fetchReports()" class="px-4 py-2 bg-[#818cf8] hover:bg-[#6366f1] text-black text-xs font-bold rounded-lg transition-all shadow-lg shadow-[#818cf8]/20 flex items-center gap-1.5 h-11">
                        <i class="fas fa-sync-alt mr-1"></i> รีเฟรช
                    </button>
                    <div class="clock-widget">
                        <div id="digital-clock">00:00:00</div>
                        <div id="digital-date">...</div>
                    </div>
                </div>
            </header>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 flex-none">
                <div class="glass-card p-4 border-l-4 border-indigo-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">ทั้งหมด</p>
                    <h3 class="text-2xl font-black text-white" id="stat-total">0</h3>
                </div>
                <div class="glass-card p-4 border-l-4 border-emerald-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">บรรลุผล</p>
                    <h3 class="text-2xl font-black text-emerald-500" id="stat-pass">0</h3>
                </div>
                <div class="glass-card p-4 border-l-4 border-rose-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">ต้องปรับปรุง</p>
                    <h3 class="text-2xl font-black text-rose-500" id="stat-issue">0</h3>
                </div>
                <div class="glass-card p-4 border-l-4 border-[#818cf8] hover:bg-white/5 transition-all flex items-center justify-end">
                    <button onclick="window.open('../Frontend/OP07.html')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-black text-[10px] uppercase transition-all shadow-lg shadow-indigo-600/20">
                        + สร้างรายงานใหม่
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="glass-card p-3 mb-3 border border-white/5 flex-none no-print">
                <div class="grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-indigo-400/80 uppercase ml-1">เริ่มวันที่</label>
                        <input type="date" id="filterStartDate" onchange="fetchReports()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-[#818cf8] outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-indigo-400/80 uppercase ml-1">ถึงวันที่</label>
                        <input type="date" id="filterEndDate" onchange="fetchReports()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-[#818cf8] outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-indigo-400/80 uppercase ml-1">เลขที่เอกสาร</label>
                        <input type="text" id="filterId" onkeyup="applyFilters()" placeholder="ค้น ID..." class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-[#818cf8] outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-indigo-400/80 uppercase ml-1">สถานที่ / หน่วยงาน</label>
                        <input type="text" id="filterVenue" onkeyup="applyFilters()" placeholder="ค้นหน่วยงาน..." class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-[#818cf8] outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-indigo-400/80 uppercase ml-1">วิทยากร</label>
                        <input type="text" id="filterTrainer" onkeyup="applyFilters()" placeholder="ค้นชื่อ..." class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-[#818cf8] outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-indigo-400/80 uppercase ml-1">เขต</label>
                        <select id="filterZone" onchange="applyFilters()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-[#818cf8] outline-none transition-all">
                            <option value="">ทั้งหมด</option>
                            <option value="เขต 1">เขต 1</option>
                            <option value="เขต 2">เขต 2</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table Container -->
            <div class="glass-card flex-1 min-h-0 flex flex-col overflow-hidden shadow-2xl p-1">
                <!-- Static Header Table -->
                <div class="flex-none bg-[#0f172a] rounded-t-xl overflow-hidden border-b border-white/5">
                    <table class="w-full text-left text-sm table-fixed">
                        <colgroup>
                            <col class="w-[5%]">
                            <col class="w-[12%]">
                            <col class="w-[12%]">
                            <col class="w-[25%]">
                            <col class="w-[15%]">
                            <col class="w-[10%]">
                            <col class="w-[10%]">
                            <col class="w-[11%]">
                        </colgroup>
                        <thead class="text-slate-500 text-[9px] font-black uppercase tracking-widest">
                            <tr>
                                <th class="px-4 py-1.5 text-center">ลำดับที่</th>
                                <th class="px-4 py-1.5">วันที่อบรม</th>
                                <th class="px-4 py-1.5 font-mono text-[#818cf8]">เลขที่เอกสาร</th>
                                <th class="px-4 py-1.5">สถานที่ / หน่วยงาน</th>
                                <th class="px-4 py-1.5">วิทยากร</th>
                                <th class="px-4 py-1.5">เขต</th>
                                <th class="px-4 py-1.5 text-center">ผลลัพธ์</th>
                                <th class="px-4 py-1.5 text-center">จัดการ</th>
                            </tr>
                        </thead>
                    </table>
                </div>

                <!-- Scrollable Body Table -->
                <div class="flex-1 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left text-sm table-fixed border-separate border-spacing-0">
                        <colgroup>
                            <col class="w-[5%]">
                            <col class="w-[12%]">
                            <col class="w-[12%]">
                            <col class="w-[25%]">
                            <col class="w-[15%]">
                            <col class="w-[10%]">
                            <col class="w-[10%]">
                            <col class="w-[11%]">
                        </colgroup>
                        <tbody id="reportList" class="divide-y divide-white/5">
                            <tr><td colspan="8" class="text-center py-10 text-slate-500 italic">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allReports = [];
        window.onload = () => { startClock(); fetchReports(); };

        function startClock() {
            const clockEl = document.getElementById('digital-clock'), dateEl = document.getElementById('digital-date');
            setInterval(() => {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
                dateEl.textContent = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }, 1000);
        }

        async function fetchReports() {
            try {
                const list = document.getElementById('reportList');
                list.innerHTML = '<tr><td colspan="8" class="py-10 text-center text-slate-500 italic">กำลังโหลดข้อมูล...</td></tr>';

                const startDate = document.getElementById('filterStartDate').value;
                const endDate = document.getElementById('filterEndDate').value;

                let query = supabaseClient.from('op07_reports').select('*');

                if (startDate) query = query.gte('visit_date', startDate);
                if (endDate) query = query.lte('visit_date', endDate);

                const { data, error } = await query.order('visit_date', { ascending: false }).limit(2000);
                if (error) throw error;
                allReports = data || [];
                renderReports(allReports);
                updateStats(allReports);
            } catch (e) {
                console.error(e);
                document.getElementById('reportList').innerHTML = '<tr><td colspan="8" class="py-10 text-center text-rose-500">Error loading data</td></tr>';
            }
        }

        function applyFilters() {
            const f = {
                id: document.getElementById('filterId').value.toLowerCase(),
                venue: document.getElementById('filterVenue').value.toLowerCase(),
                trainer: document.getElementById('filterTrainer').value.toLowerCase(),
                zone: document.getElementById('filterZone').value
            };

            const filtered = allReports.filter(r => {
                return (!f.id || r.doc_id.toLowerCase().includes(f.id)) &&
                       (!f.venue || r.venue.toLowerCase().includes(f.venue)) &&
                       (!f.trainer || r.trainer.toLowerCase().includes(f.trainer)) &&
                       (!f.zone || r.zone === f.zone);
            });
            renderReports(filtered);
        }

        function renderReports(reports) {
            const list = document.getElementById('reportList');
            if (reports.length === 0) {
                list.innerHTML = '<tr><td colspan="8" class="p-20 text-center text-slate-600">ไม่พบข้อมูลรายงาน</td></tr>';
                return;
            }

            list.innerHTML = reports.map((r, index) => `
                <tr class="hover:bg-white/[0.02] transition-colors border-b border-white/5">
                    <td class="px-4 py-1.5 text-center text-slate-500 font-mono text-[10px]">${index + 1}</td>
                    <td class="px-4 py-1.5 font-bold text-white text-xs">${formatThaiDate(r.visit_date)}</td>
                    <td class="px-4 py-1.5 font-bold text-[#818cf8] font-mono text-xs">${r.doc_id}</td>
                    <td class="px-4 py-1.5 font-bold text-white text-xs uppercase truncate leading-tight" title="${r.venue}">${r.venue}</td>
                    <td class="px-4 py-1.5 text-slate-400 text-[10px]">${r.trainer}</td>
                    <td class="px-4 py-1.5 text-slate-500 text-[10px]">${r.zone || '-'}</td>
                    <td class="px-4 py-1.5 text-center">
                        <span class="status-badge status-${r.overall_result}">
                            ${r.overall_result === 'pass' ? 'บรรลุผล' : (r.overall_result === 'warn' ? 'บางส่วน' : 'ปรับปรุง')}
                        </span>
                    </td>
                    <td class="px-4 py-1.5 text-center">
                        <button onclick="viewDetail('${r.id}')" class="px-3 py-1 rounded-lg bg-white/5 text-slate-400 hover:bg-[#818cf8] hover:text-black transition-all text-[10px] font-bold uppercase">
                            <i class="fas fa-file-invoice mr-1"></i> ดูรายละเอียด
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(reports) {
            document.getElementById('stat-total').innerText = reports.length;
            document.getElementById('stat-pass').innerText = reports.filter(r => r.overall_result === 'pass').length;
            document.getElementById('stat-issue').innerText = reports.filter(r => r.overall_result === 'issue').length;
        }

        function formatThaiDate(dateStr) {
            if(!dateStr) return '-';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${parseInt(y) + 543}`;
        }

        function viewDetail(id) {
            window.open(`../Frontend/OP07-View.html?id=${id}`, '_blank');
        }
    </script>
</body>
</html>
