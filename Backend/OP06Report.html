<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการรวมแถว (OP06) | NEXTGEN System Center</title>
    
    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <script src="js/sidebar.js"></script>

    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        :root { --primary: #f59e0b; }
        body { font-family: 'Sarabun', sans-serif; background: #020617; color: white; margin: 0; overflow: hidden; }
        .main-content { flex: 1; padding: 16px; background-image: radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 600px); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; }
        
        .clock-widget { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 8px 16px; border-radius: 16px; text-align: right; min-width: 180px; }
        #digital-clock { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; color: #f59e0b; line-height: 1; margin-bottom: 4px; }
        #digital-date { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #64748b; }

        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-normal { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-issue { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); }
        .status-warn { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }

        .submenu.open { display: block; }
    </style>
</head>

<body>
    <div class="flex h-screen w-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar-container" class="sidebar flex flex-col shrink-0"></aside>

        <!-- Main Content -->
        <main class="main-content flex flex-col h-full overflow-hidden pb-10">
            
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 flex-none">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-amber-600/20 flex items-center justify-center border border-amber-600/30">
                        <i class="fas fa-users-line text-xl text-amber-500"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black tracking-tighter uppercase leading-none mb-1">
                            Formation <span class="text-amber-500">Reports (OP06)</span>
                        </h1>
                        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[3px]">
                            รายงานการรวมแถว (OP06)
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="fetchReports()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold rounded-lg transition-all shadow-lg shadow-amber-500/20 flex items-center gap-1.5 h-11">
                        <i class="fas fa-sync-alt mr-1"></i> รีเฟรช
                    </button>
                    <div class="clock-widget">
                        <div id="digital-clock">00:00:00</div>
                        <div id="digital-date">...</div>
                    </div>
                </div>
            </header>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 flex-none">
                <div class="glass-card p-4 border-l-4 border-blue-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">ทั้งหมด</p>
                    <h3 class="text-2xl font-black text-white" id="stat-total">0</h3>
                </div>
                <div class="glass-card p-4 border-l-4 border-emerald-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">ปกติ</p>
                    <h3 class="text-2xl font-black text-emerald-500" id="stat-normal">0</h3>
                </div>
                <div class="glass-card p-4 border-l-4 border-amber-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">มีกำชับ</p>
                    <h3 class="text-2xl font-black text-amber-500" id="stat-warn">0</h3>
                </div>
                <div class="glass-card p-4 border-l-4 border-rose-500 hover:bg-white/5 transition-all">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">พบปัญหา</p>
                    <h3 class="text-2xl font-black text-rose-500" id="stat-issue">0</h3>
                </div>
            </div>

            <!-- Filters -->
            <div class="glass-card p-3 mb-3 border border-white/5 flex-none no-print">
                <div class="grid grid-cols-2 md:grid-cols-7 gap-3 items-end">
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">เริ่มวันที่</label>
                        <input type="date" id="filterStartDate" onchange="fetchReports()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">ถึงวันที่</label>
                        <input type="date" id="filterEndDate" onchange="fetchReports()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">เลขที่เอกสาร</label>
                        <input type="text" id="filterId" onkeyup="applyFilters()" placeholder="ค้น ID..." class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">หน่วยงาน</label>
                        <input type="text" id="filterSite" onkeyup="applyFilters()" placeholder="ค้นหน่วยงาน..." class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">ผู้นำแถว</label>
                        <input type="text" id="filterCmd" onkeyup="applyFilters()" placeholder="ค้นชื่อ..." class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">ผลัด</label>
                        <select id="filterShift" onchange="applyFilters()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                            <option value="">ทั้งหมด</option>
                            <option value="ผลัดเช้า">เช้า</option>
                            <option value="ผลัดเย็น">เย็น</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-amber-500/80 uppercase ml-1">สถานะ</label>
                        <select id="filterResult" onchange="applyFilters()" class="w-full bg-[#020617] border border-slate-700/50 rounded-lg py-1.5 px-3 text-white text-xs focus:border-amber-500 outline-none transition-all">
                            <option value="">ทั้งหมด</option>
                            <option value="pass">ปกติ</option>
                            <option value="warn">มีกำชับ</option>
                            <option value="issue">พบปัญหา</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table Container -->
            <div class="glass-card flex-1 min-h-0 flex flex-col overflow-hidden shadow-2xl p-1">
                <!-- Static Header Table -->
                <div class="flex-none bg-[#0f172a] rounded-t-xl overflow-hidden border-b border-white/5">
                    <table class="w-full text-left text-sm table-fixed">
                        <colgroup>
                            <col class="w-[5%]">
                            <col class="w-[12%]">
                            <col class="w-[12%]">
                            <col class="w-[24%]">
                            <col class="w-[15%]">
                            <col class="w-[8%]">
                            <col class="w-[12%]">
                            <col class="w-[10%]">
                            <col class="w-[12%]">
                        </colgroup>
                        <thead class="text-slate-500 text-[9px] font-black uppercase tracking-widest">
                            <tr>
                                <th class="px-4 py-1.5 text-center">ลำดับที่</th>
                                <th class="px-4 py-1.5">วันที่</th>
                                <th class="px-4 py-1.5 font-mono text-amber-500">เลขที่เอกสาร</th>
                                <th class="px-4 py-1.5">หน่วยงาน</th>
                                <th class="px-4 py-1.5">ผู้นำแถว</th>
                                <th class="px-4 py-1.5">ผลัด</th>
                                <th class="px-4 py-1.5">กำลังพล</th>
                                <th class="px-4 py-1.5 text-center">สถานะ</th>
                                <th class="px-4 py-1.5 text-center">จัดการ</th>
                            </tr>
                        </thead>
                    </table>
                </div>

                <!-- Scrollable Body Table -->
                <div class="flex-1 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left text-sm table-fixed border-separate border-spacing-0">
                        <colgroup>
                            <col class="w-[5%]">
                            <col class="w-[12%]">
                            <col class="w-[12%]">
                            <col class="w-[24%]">
                            <col class="w-[15%]">
                            <col class="w-[8%]">
                            <col class="w-[12%]">
                            <col class="w-[10%]">
                            <col class="w-[12%]">
                        </colgroup>
                        <tbody id="reportList" class="divide-y divide-white/5">
                            <tr><td colspan="9" class="text-center py-10 text-slate-500 italic">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let allReports = [];
        let filteredReports = [];

        window.onload = () => {
            startClock();
            fetchReports();
        };

        function startClock() {
            const clockEl = document.getElementById('digital-clock');
            const dateEl = document.getElementById('digital-date');
            function update() {
                const now = new Date();
                const options = { timeZone: 'Asia/Bangkok' };
                clockEl.textContent = now.toLocaleTimeString('en-GB', { ...options, hour12: false });
                dateEl.textContent = now.toLocaleDateString('th-TH', { 
                    ...options, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' 
                });
            }
            setInterval(update, 1000); update();
        }

        async function fetchReports() {
            try {
                const list = document.getElementById('reportList');
                list.innerHTML = '<tr><td colspan="9" class="text-center py-10 text-slate-500 italic">กำลังโหลดข้อมูล...</td></tr>';

                const startDate = document.getElementById('filterStartDate').value;
                const endDate = document.getElementById('filterEndDate').value;

                let query = supabaseClient.from('op06_reports').select('*');

                if (startDate) query = query.gte('form_date', startDate);
                if (endDate) query = query.lte('form_date', endDate);

                const { data, error } = await query.order('created_at', { ascending: false }).limit(2000);
                if (error) throw error;
                allReports = data || [];
                filteredReports = [...allReports];
                renderReports(filteredReports);
                updateStats(allReports);
            } catch (e) {
                console.error("Fetch error:", e);
                const list = document.getElementById('reportList');
                list.innerHTML = '<tr><td colspan="9" class="p-20 text-center text-rose-500 font-bold">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        function applyFilters() {
            const filters = {
                id: document.getElementById('filterId').value.toLowerCase(),
                site: document.getElementById('filterSite').value.toLowerCase(),
                cmd: document.getElementById('filterCmd').value.toLowerCase(),
                shift: document.getElementById('filterShift').value,
                result: document.getElementById('filterResult').value
            };

            filteredReports = allReports.filter(r => {
                const matchId = !filters.id || (r.doc_id && r.doc_id.toLowerCase().includes(filters.id));
                const matchSite = !filters.site || (r.site_name && r.site_name.toLowerCase().includes(filters.site));
                const matchCmd = !filters.cmd || (r.commander && r.commander.toLowerCase().includes(filters.cmd));
                const matchShift = !filters.shift || (r.shift && r.shift === filters.shift);
                const matchResult = !filters.result || (r.overall_result && r.overall_result === filters.result);
                return matchId && matchSite && matchCmd && matchShift && matchResult;
            });

            renderReports(filteredReports);
        }

        function renderReports(reports) {
            const list = document.getElementById('reportList');
            if (reports.length === 0) {
                list.innerHTML = '<tr><td colspan="9" class="p-20 text-center text-slate-600 italic">ไม่พบข้อมูลรายงาน</td></tr>';
                return;
            }

            list.innerHTML = reports.map((r, index) => {
                let badgeClass = 'status-normal';
                let statusText = 'ปกติ';
                if (r.overall_result === 'issue') {
                    badgeClass = 'status-issue';
                    statusText = 'พบปัญหา';
                } else if (r.overall_result === 'warn') {
                    badgeClass = 'status-warn';
                    statusText = 'มีกำชับ';
                }

                const att = r.attendance || [];
                const total = att.length;
                const present = att.filter(a => a.status === 'present' || a.status === 'late').length;

                // Format Date to Thai
                let dateStr = r.form_date || '-';
                if (r.form_date) {
                    const [y, m, d] = r.form_date.split('-');
                    dateStr = `${d}/${m}/${parseInt(y) + 543}`;
                }

                return `
                    <tr class="hover:bg-white/[0.02] transition-colors border-b border-white/5">
                        <td class="px-4 py-1.5 text-center text-slate-500 font-mono text-[10px]">${index + 1}</td>
                        <td class="px-4 py-1.5 font-bold text-white text-xs">${dateStr}</td>
                        <td class="px-4 py-1.5 font-bold text-amber-500 font-mono text-xs">${r.doc_id || '-'}</td>
                        <td class="px-4 py-1.5 font-bold text-white text-xs uppercase truncate leading-tight" title="${r.site_name}">${r.site_name || '-'}</td>
                        <td class="px-4 py-1.5 text-slate-300 text-xs font-medium">${r.commander || '-'}</td>
                        <td class="px-4 py-1.5 text-slate-400 text-xs">${r.shift || '-'}</td>
                        <td class="px-4 py-1.5 text-slate-300 font-bold text-xs">${present} / ${total} นาย</td>
                        <td class="px-4 py-1.5 text-center">
                            <span class="status-badge ${badgeClass}">${statusText}</span>
                        </td>
                        <td class="px-4 py-1.5 text-center">
                            <button onclick="viewDetail('${r.id}')" class="px-3 py-1 rounded-lg bg-white/5 text-slate-400 hover:bg-amber-500 hover:text-black transition-all text-[10px] font-bold uppercase">
                                <i class="fas fa-file-alt mr-1"></i> รายละเอียด
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(reports) {
            document.getElementById('stat-total').textContent = reports.length;
            document.getElementById('stat-normal').textContent = reports.filter(r => r.overall_result === 'pass' || !r.overall_result).length;
            document.getElementById('stat-warn').textContent = reports.filter(r => r.overall_result === 'warn').length;
            document.getElementById('stat-issue').textContent = reports.filter(r => r.overall_result === 'issue').length;
        }

        function viewDetail(id) {
            window.open('../Frontend/OP06-View.html?id=' + id + '&print=true', '_blank');
        }
    </script>
</body>
</html>
